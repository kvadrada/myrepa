<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hidden Rooms</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent: #4A90D9;
  --accent-dk: #2D6BA8;
  --bg: #EEE8DF;
  --card: #FFFFFF;
  --text: #1A1A2E;
  --muted: #999;
}
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.screen {
  display: none;
  width: 100%;
  max-width: 480px;
  padding: 20px;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  min-height: 100vh;
  justify-content: center;
}
.screen.active { display: flex; }

/* Title */
.hero-icon { font-size: 88px; animation: bob 3s ease-in-out infinite; display: block; }
@keyframes bob { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-12px) rotate(4deg)} }
h1 { font-size: 2.4rem; font-weight: 900; color: var(--text); letter-spacing: -1px; text-align: center; }
h1 em { color: var(--accent); font-style: normal; }
.tagline { color: var(--muted); font-size: 0.9rem; text-align: center; }

/* Buttons */
.btn {
  background: var(--accent); color: #fff; border: none;
  padding: 14px 40px; border-radius: 50px;
  font-size: 1.05rem; font-weight: 700; cursor: pointer;
  box-shadow: 0 5px 0 var(--accent-dk);
  transition: transform .1s, box-shadow .1s;
}
.btn:hover  { transform: translateY(-2px); box-shadow: 0 7px 0 var(--accent-dk); }
.btn:active { transform: translateY(3px);  box-shadow: 0 2px 0 var(--accent-dk); }
.btn-ghost {
  background: #E5DFD8; color: #666;
  box-shadow: 0 5px 0 #CEC8C0;
}
.btn-ghost:hover  { box-shadow: 0 7px 0 #CEC8C0; }
.btn-ghost:active { box-shadow: 0 2px 0 #CEC8C0; }
.btn-row { display: flex; gap: 12px; }

/* Level select */
.top-bar { display: flex; align-items: center; gap: 12px; width: 100%; }
.back-btn {
  background: #E5DFD8; border: none; width: 38px; height: 38px;
  border-radius: 12px; font-size: 1.1rem; cursor: pointer;
  color: #666; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.screen-title { font-size: 1.4rem; font-weight: 800; color: var(--text); }
.levels-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; width: 100%; }
.lv-btn {
  aspect-ratio: 1; border-radius: 16px; border: none;
  background: var(--card); box-shadow: 0 3px 0 #CEC8C0;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; cursor: pointer; gap: 3px;
  font-weight: 700; color: var(--text); font-size: 0.85rem;
  transition: transform .1s, box-shadow .1s;
}
.lv-btn:hover:not(.locked) { transform: translateY(-2px); box-shadow: 0 5px 0 #CEC8C0; }
.lv-btn:active:not(.locked){ transform: translateY(2px);  box-shadow: 0 1px 0 #CEC8C0; }
.lv-btn .lv-icon  { font-size: 1.4rem; }
.lv-btn .lv-stars { font-size: .42rem; letter-spacing: 1px; }
.lv-btn.locked  { background: #EDE8E2; color: #C5BFB8; cursor: default; box-shadow: none; }
.lv-btn.done    { background: #E8F4E9; }
.lv-btn.perfect { background: #FFFBE6; }

/* Game screen */
#game-screen { gap: 10px; justify-content: flex-start; padding-top: 18px; }
.game-hdr {
  display: flex; align-items: center; gap: 8px; width: 100%;
}
.game-lv { font-size: .95rem; font-weight: 800; color: var(--text); flex: 1; }
.hint-btn {
  background: #FFF8E1; border: 2px solid #FFD54F;
  border-radius: 20px; padding: 6px 14px;
  font-size: .82rem; font-weight: 700; cursor: pointer; color: #7B5800;
  display: flex; align-items: center; gap: 5px;
}
.hint-btn:hover { background: #FFF3CD; }
.hint-btn:disabled { opacity: .4; cursor: default; }

/* Scene */
.scene-wrap {
  width: 100%; position: relative;
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 6px 28px rgba(0,0,0,.14);
  cursor: crosshair; user-select: none;
}
.scene-wrap::after { content:''; display:block; padding-top: 62%; }
.scene-inner { position: absolute; inset: 0; }
.scene-floor {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 42%; border-radius: 0 0 20px 20px;
}

/* Scene items */
.si {
  position: absolute;
  transform: translate(-50%,-50%);
  line-height: 1; user-select: none; pointer-events: none;
}
.si.tgt {
  pointer-events: auto; cursor: pointer;
  transition: filter .15s;
}
.si.tgt:not(.found):hover { filter: brightness(1.15) drop-shadow(0 0 4px rgba(255,255,255,.6)); }
.si.found { animation: foundPop .38s ease forwards; pointer-events: none; }
@keyframes foundPop {
  0%   { transform: translate(-50%,-50%) scale(1);   opacity: 1; filter: none; }
  40%  { transform: translate(-50%,-50%) scale(1.9); filter: brightness(2) saturate(2); }
  100% { transform: translate(-50%,-50%) scale(0);   opacity: 0; }
}
.si.glowing { animation: hintGlow .5s ease-in-out 4; }
@keyframes hintGlow {
  0%,100% { filter: none; }
  50% { filter: drop-shadow(0 0 10px #FFD54F) brightness(1.7); }
}

/* Miss feedback */
.miss {
  position: absolute; transform: translate(-50%,-50%);
  font-size: 1.3rem; font-weight: 900; color: #E53935;
  pointer-events: none; z-index: 40;
  animation: missAnim .45s ease forwards;
}
@keyframes missAnim {
  0%   { transform: translate(-50%,-50%) scale(.5); opacity: 1; }
  100% { transform: translate(-50%,-60%) scale(1.1); opacity: 0; }
}

/* Found badge */
.found-badge {
  font-size: .82rem; font-weight: 700; color: var(--muted);
  width: 100%; text-align: right;
}

/* Thumbnails */
.thumbs-lbl {
  font-size: .68rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1.2px;
  font-weight: 700; width: 100%;
}
.thumbs-scroll { width: 100%; overflow-x: auto; scrollbar-width: none; }
.thumbs-scroll::-webkit-scrollbar { display: none; }
.thumbs-row { display: flex; gap: 8px; padding: 3px 2px; min-width: max-content; }
.tcard {
  width: 70px; background: var(--card); border-radius: 14px;
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 6px 8px; gap: 5px;
  box-shadow: 0 2px 0 #CEC8C0; flex-shrink: 0; position: relative;
  transition: background .3s, opacity .3s;
}
.tcard.found { background: #E8F5E9; opacity: .7; }
.tcard .te { font-size: 2rem; line-height: 1; }
.tcard .tn { font-size: .6rem; font-weight: 700; color: #666; text-align: center; }
.tcard .tc {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; opacity: 0;
  border-radius: 14px; background: rgba(200,240,210,.65);
  transition: opacity .3s;
}
.tcard.found .tc { opacity: 1; }

/* Overlays */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(15,15,30,.6);
  align-items: center; justify-content: center;
  z-index: 200; backdrop-filter: blur(4px);
}
.overlay.active { display: flex; }
.ov-card {
  background: #fff; border-radius: 28px; padding: 36px 28px;
  text-align: center; width: min(320px,90vw);
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  animation: slideUp .3s ease;
}
@keyframes slideUp {
  from { transform: translateY(30px) scale(.95); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
.ov-icon  { font-size: 72px; line-height: 1; }
.ov-title { font-size: 1.8rem; font-weight: 900; color: var(--text); }
.ov-stars { font-size: 2rem; letter-spacing: 8px; }
.ov-sub   { font-size: .9rem; color: var(--muted); line-height: 1.5; }

/* Toast */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text); color: #fff;
  border-radius: 16px; padding: 12px 20px;
  font-size: .88rem; max-width: min(300px,85vw);
  text-align: center; transition: transform .36s ease;
  z-index: 150; pointer-events: none; line-height: 1.4;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-height: 700px) {
  #game-screen { gap: 6px; padding-top: 10px; }
  .tcard { width: 60px; }
  .tcard .te { font-size: 1.6rem; }
}
</style>
</head>

let currentLevel = 0, hintsLeft = 3, foundCount = 0;
let sceneItems = [];
let progress = {};
let toastTimer = null;
try { progress = JSON.parse(localStorage.getItem('hiddenRooms') || '{}'); } catch(_){}

function saveProgress(lvl, stars) {
  if ((progress[lvl] || 0) < stars) {
    progress[lvl] = stars;
    localStorage.setItem('hiddenRooms', JSON.stringify(progress));
  }
}

// ── screens ───────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showLevelSelect() {
  buildLevelGrid();
  showScreen('level-select-screen');
}

function buildLevelGrid() {
  const el = document.getElementById('levels-grid');
  el.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const btn = document.createElement('button');
    btn.className = 'lv-btn';
    const stars = progress[i] || 0;
    const unlocked = i === 0 || (progress[i-1] || 0) > 0;
    if (!unlocked) {
      btn.classList.add('locked');
      btn.innerHTML = '<span style="font-size:1.3rem">🔒</span>';
    } else {
      if (stars === 3) btn.classList.add('perfect');
      else if (stars > 0) btn.classList.add('done');
      btn.innerHTML = `<span class="lv-icon">${lv.icon}</span><span>${i+1}</span><span class="lv-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</span>`;
      btn.onclick = () => startLevel(i);
    }
    el.appendChild(btn);
  });
}

// ── level init ────────────────────────────────────────────────────────────
function startLevel(idx) {
  currentLevel = idx;
  showScreen('game-screen');
  initLevel(idx);
}

function initLevel(idx) {
  const lv = LEVELS[idx];
  hintsLeft = 3;
  foundCount = 0;
  document.getElementById('win-ov').classList.remove('active');
  document.getElementById('game-lv').textContent = `${lv.icon} ${lv.name}`;
  document.getElementById('hint-count').textContent = '3';
  document.getElementById('hint-btn').disabled = false;
  // Deep clone items
  sceneItems = lv.items.map(it => ({...it, found: false}));
  updateFoundBadge();
  buildThumbs();
  renderScene(lv);
  setTimeout(() => showToast(lv.story), 400);
}

// ── scene rendering ───────────────────────────────────────────────────────
function renderScene(lv) {
  const inner = document.getElementById('scene-inner');
  // Remove old items (keep floor div)
  [...inner.querySelectorAll('.si')].forEach(el => el.remove());
  inner.style.background = lv.wall;
  document.getElementById('scene-floor').style.background = lv.floor;

  const wrap = document.getElementById('scene-wrap');
  const W = wrap.offsetWidth || 440;
  const scale = W / 460;

  // Sort by y so lower items render on top (natural layering)
  const sorted = [...sceneItems].sort((a,b) => a.y - b.y);

  sorted.forEach(item => {
    const el = document.createElement('div');
    el.className = 'si' + (item.tgt ? ' tgt' : '');
    el.textContent = item.e;
    el.style.left = item.x + '%';
    el.style.top  = item.y + '%';
    el.style.fontSize = Math.round(item.s * scale) + 'px';
    if (item.tgt) el.dataset.id = item.id;
    inner.appendChild(el);
  });

  inner.onclick = onSceneClick;
}

// ── interaction ───────────────────────────────────────────────────────────
function onSceneClick(e) {
  const inner = document.getElementById('scene-inner');
  const rect  = inner.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const W  = rect.width;
  const H  = rect.height;
  const scale = W / 460;

  let best = null, bestDist = Infinity;

  for (const item of sceneItems) {
    if (!item.tgt || item.found) continue;
    const ix = (item.x / 100) * W;
    const iy = (item.y / 100) * H;
    const r  = Math.max(item.s * scale * 0.6, 22);
    const d  = Math.hypot(px - ix, py - iy);
    if (d < r && d < bestDist) { bestDist = d; best = item; }
  }

  if (best) {
    foundItem(best);
  } else {
    // Miss feedback
    const x = document.createElement('div');
    x.className = 'miss';
    x.textContent = '✕';
    x.style.left = px + 'px';
    x.style.top  = py + 'px';
    inner.appendChild(x);
    setTimeout(() => x.remove(), 500);
  }
}

function foundItem(item) {
  item.found = true;
  foundCount++;

  // Animate scene element
  const el = document.querySelector(`.si[data-id="${item.id}"]`);
  if (el) el.classList.add('found');

  // Update thumbnail
  const card = document.querySelector(`.tcard[data-id="${item.id}"]`);
  if (card) card.classList.add('found');

  updateFoundBadge();

  const targets = sceneItems.filter(i => i.tgt);
  if (foundCount === targets.length) {
    setTimeout(showWin, 450);
  }
}

// ── hints ─────────────────────────────────────────────────────────────────
function useHint() {
  if (hintsLeft <= 0) return;
  const unfound = sceneItems.filter(i => i.tgt && !i.found);
  if (!unfound.length) return;

  hintsLeft--;
  document.getElementById('hint-count').textContent = hintsLeft;
  if (hintsLeft === 0) document.getElementById('hint-btn').disabled = true;

  const pick = unfound[Math.floor(Math.random() * unfound.length)];
  const el   = document.querySelector(`.si[data-id="${pick.id}"]`);
  if (el) {
    el.classList.add('glowing');
    // Also scroll thumbs to that card
    const card = document.querySelector(`.tcard[data-id="${pick.id}"]`);
    if (card) card.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    setTimeout(() => el.classList.remove('glowing'), 2200);
  }
}

// ── HUD helpers ───────────────────────────────────────────────────────────
function updateFoundBadge() {
  const targets = sceneItems.filter(i => i.tgt);
  document.getElementById('found-badge').textContent = `${foundCount} / ${targets.length} found`;
}

function buildThumbs() {
  const row = document.getElementById('thumbs-row');
  row.innerHTML = '';
  sceneItems.filter(i => i.tgt).forEach(item => {
    const card = document.createElement('div');
    card.className = 'tcard';
    card.dataset.id = item.id;
    card.innerHTML = `<div class="te">${item.e}</div><div class="tn">${item.nm}</div><div class="tc">✓</div>`;
    row.appendChild(card);
  });
}

// ── win ───────────────────────────────────────────────────────────────────
function showWin() {
  const stars = hintsLeft === 3 ? 3 : hintsLeft === 2 ? 2 : 1;
  saveProgress(currentLevel, stars);
  buildLevelGrid();

  document.getElementById('win-icon').textContent  = stars === 3 ? '🏅' : '🎉';
  document.getElementById('win-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('win-sub').textContent   =
    stars === 3 ? 'Perfect! You used zero hints.' :
    stars === 2 ? 'Well done! Only one hint used.' :
                  'All objects found! Try again for more stars.';
  document.getElementById('next-btn').style.display =
    currentLevel < LEVELS.length - 1 ? '' : 'none';
  document.getElementById('win-ov').classList.add('active');
}

function nextLevel() {
  if (currentLevel < LEVELS.length - 1) startLevel(currentLevel + 1);
}

function confirmBack() {
  if (confirm('Leave this room? Progress will be lost.')) showLevelSelect();
}

// ── toast ─────────────────────────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

// Recalc font sizes on resize
window.addEventListener('resize', () => {
  if (document.getElementById('game-screen').classList.contains('active')) {
    renderScene(LEVELS[currentLevel]);
  }
});
</script>
</body>
</html>
