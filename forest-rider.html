<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Forest Rider</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const c=document.getElementById('c');
const g=c.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);
  c.style.width=W+'px';c.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
}
resize();window.addEventListener('resize',resize);

// ── helpers ────────────────────────────────────────────────────────
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function lerpHex(a,b,t){
  const[ar,ag,ab]=hexRgb(a),[br,bg,bb]=hexRgb(b);
  return'#'+(((Math.round(ar+(br-ar)*t))<<16)|((Math.round(ag+(bg-ag)*t))<<8)|(Math.round(ab+(bb-ab)*t))).toString(16).padStart(6,'0');
}
function hexA(h,a){const[r,gv,b]=hexRgb(h);return`rgba(${r},${gv},${b},${a})`;}
function angNorm(a){return((a%(Math.PI*2))+Math.PI*3)%(Math.PI*2)-Math.PI;}
function rr(x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);
  g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);
  g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);
  g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}

// ── camera: tracks player in both X and Y ──────────────────────────
// terrain/player/objects drawn in world space offset by (camX, camY)
// backgrounds (sky, mountains, clouds) drawn in pure screen space
let camX=0, camY=0;
const wx=worldX=>worldX-camX;      // world → screen X
const wy=worldY=>worldY-camY;      // world → screen Y (full follow)
const wby=worldY=>worldY-camY*0.3; // world → screen Y (30% follow for bg trees)

// ── sky keyframes ──────────────────────────────────────────────────
const SKY=[
  [0.00,'#050817','#0d1340','#192358'],
  [0.16,'#1c0a3a','#56185c','#8f3a4a'],
  [0.25,'#4a2a6e','#e06a3a','#ffc168'],
  [0.33,'#3076b8','#78c0f0','#d6eeff'],
  [0.50,'#1e6ab4','#60a8e0','#c0e2ff'],
  [0.67,'#3076b8','#84b8e2','#ffd5a0'],
  [0.75,'#533070','#e0623a','#ff9d4a'],
  [0.84,'#1c0a3a','#3a1a55','#6e2a50'],
  [1.00,'#050817','#0d1340','#192358'],
];
function skyAt(t){
  for(let i=0;i<SKY.length-1;i++){
    if(t>=SKY[i][0]&&t<=SKY[i+1][0]){
      let f=(t-SKY[i][0])/(SKY[i+1][0]-SKY[i][0]);f=f*f*(3-2*f);
      return{a:lerpHex(SKY[i][1],SKY[i+1][1],f),
             b:lerpHex(SKY[i][2],SKY[i+1][2],f),
             c:lerpHex(SKY[i][3],SKY[i+1][3],f)};
    }
  }
  return{a:SKY[0][1],b:SKY[0][2],c:SKY[0][3]};
}
const nightAmt=t=>{let v=t<0.22?1-t/0.22:t>0.78?(t-0.78)/0.22:0;return v*v*(3-2*v);};
const duskAmt=t=>Math.max(Math.max(0,1-Math.abs(t-0.245)/0.075),Math.max(0,1-Math.abs(t-0.755)/0.075));

// ── constants ──────────────────────────────────────────────────────
const GRAVITY=0.46,JUMP_V=-13.2,SPD_MIN=4.2,SPD_MAX=15;
const SLOPE_A=0.32,PEDAL_A=0.015,SPIN_ACC=0.020,SPIN_MAX=0.24;
const DAY_SPD=0.00011,SEG_W=80,PLR_H=18;
const MAG_R=110,COL_R=30,TOTAL_LEVELS=20,LEVEL_SEC=45;

// ── level config ───────────────────────────────────────────────────
const PRIZES=[
  {coins:15},{coins:30},{coins:45},{coins:60},
  {coins:75,unlock:1,text:'Nova Unlocked!'},
  {coins:90},{coins:105},{coins:120},{coins:135},
  {coins:150,boost:true,text:'Speed Boost!'},
  {coins:165},{coins:180},{coins:195},{coins:210},
  {coins:225,unlock:2,text:'Sylvan Unlocked!'},
  {coins:240},{coins:255},{coins:270},{coins:285},
  {coins:500,badge:true,text:'Forest Legend!'},
];
function getLvlCfg(lv){return{
  obstGap:Math.max(220,540-lv*18),
  hasLog:lv>=3,hasStump:lv>=6,hasCrate:lv>=11,
  terrainAmp:1+Math.min(lv*0.08,0.8),
  minSpd:SPD_MIN+(lv-1)*0.22+(speedBoostActive?1.5:0),
};}

// ── persistent data ────────────────────────────────────────────────
let highScore=+localStorage.getItem('fr_hs')||0;
let totalCoins=+localStorage.getItem('fr_coins')||0;
let unlockedChars=JSON.parse(localStorage.getItem('fr_chars')||'[0]');
let selectedChar=+localStorage.getItem('fr_char')||0;
let isLegend=!!localStorage.getItem('fr_legend');

// ── runtime state ──────────────────────────────────────────────────
let state='menu',dayTime=0.40,score=0,dist=0,sesCoins=0;
let currentLevel=1,levelTimer=LEVEL_SEC,levelPending=false,levelShowT=0,speedBoostActive=false;

// ── terrain (Catmull-Rom) ──────────────────────────────────────────
let terrain=[],tLastX=0,tGenY=0,tTrend=0,tTC=0;
// gaps: {s:worldX start, e:worldX end}
let gaps=[],gapFrontier=800;

function tRaw(x){
  const n=terrain.length;
  if(n<4)return{y:0,ang:0};
  let i=Math.floor((x-terrain[0].x)/SEG_W);i=clamp(i,1,n-3);
  const p0=terrain[i-1].y,p1=terrain[i].y,p2=terrain[i+1].y,p3=terrain[i+2].y;
  const t=clamp((x-terrain[i].x)/SEG_W,0,1),t2=t*t,t3=t2*t;
  const y=0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
  const dy=0.5*((-p0+p2)+2*(2*p0-5*p1+4*p2-p3)*t+3*(-p0+3*p1-3*p2+p3)*t2)/SEG_W;
  return{y,ang:Math.atan(dy)};
}
function inGap(x){
  for(const gap of gaps)if(x>gap.s+6&&x<gap.e-6)return true;
  return false;
}
function tInfo(x){
  if(inGap(x))return{y:99999,ang:0}; // player falls through
  return tRaw(x);
}
function genGaps(upTo){
  if(currentLevel<3){gapFrontier=Math.max(gapFrontier,upTo);return;}
  const minW=80+currentLevel*2, maxW=110+currentLevel*3;
  const spacing=Math.max(300,560-currentLevel*14);
  while(gapFrontier<upTo){
    gapFrontier+=spacing+Math.random()*220;
    if(Math.abs(tRaw(gapFrontier).ang)>0.22)continue;
    const w=minW+Math.random()*(maxW-minW);
    gaps.push({s:gapFrontier,e:gapFrontier+w});
    gapFrontier+=w+200;
  }
  gaps=gaps.filter(gap=>gap.e>camX-200);
}
function genTerrain(upTo){
  const cfg=getLvlCfg(currentLevel);
  if(!terrain.length){
    tGenY=0; // world y=0 is the baseline; camera places it at H*0.46 on screen
    for(let i=0;i<4;i++)terrain.push({x:-480+i*SEG_W,y:tGenY});
    tLastX=terrain[terrain.length-1].x;
  }
  while(tLastX<upTo){
    tLastX+=SEG_W;tTC--;
    if(tTC<=0){tTrend=(Math.random()<0.46)?1:(Math.random()<0.5?0:-1);tTC=3+Math.floor(Math.random()*8);}
    const amp=(10+Math.random()*22)*cfg.terrainAmp;
    const dy=tTrend*amp+(Math.random()-0.5)*14;
    tGenY=clamp(tGenY+dy,-H*0.32,H*0.28); // world Y range: -32%H to +28%H from baseline
    terrain.push({x:tLastX,y:tGenY});
  }
  while(terrain.length>8&&terrain[1].x<camX-500)terrain.shift();
}

// ── trees ──────────────────────────────────────────────────────────
let trees=[],treeEnd=0;
function genTrees(upTo){
  while(treeEnd<upTo){
    treeEnd+=50+Math.random()*110;
    trees.push({x:treeEnd,y:tInfo(treeEnd).y,
      sc:0.5+Math.random()*0.9,k:Math.floor(Math.random()*3),
      lay:Math.random()<0.35?0:1,sh:0.85+Math.random()*0.3});
  }
  trees=trees.filter(t=>t.x>camX-300);
}

// ── coins: always above terrain, never in gaps ────────────────────
let coins=[],coinEnd=200;
function genCoins(upTo){
  while(coinEnd<upTo){
    coinEnd+=160+Math.random()*220;
    if(inGap(coinEnd)){coinEnd+=120;continue;}
    if(Math.random()<0.5){
      const n=5+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){
        const x=coinEnd+i*42;
        if(inGap(x))continue;
        const ty=tRaw(x).y;
        coins.push({x,y:ty-(36+Math.sin(i/(n-1)*Math.PI)*52),hit:false,ph:Math.random()*6.28});
      }
      coinEnd+=n*42;
    } else {
      const ty=tRaw(coinEnd).y;
      coins.push({x:coinEnd,y:ty-(34+Math.random()*50),hit:false,ph:Math.random()*6.28});
    }
  }
  coins=coins.filter(cn=>{
    if(cn.hit&&cn.x<camX-90)return false;
    if(inGap(cn.x))return false;
    const ty=tRaw(cn.x).y;if(cn.y>ty-24)cn.y=ty-24;
    return true;
  });
}

// ── obstacles: from level 1, skip gaps and steep slopes ──────────
const OBS={rock:{hw:22,h:30},log:{hw:28,h:16},stump:{hw:13,h:24},crate:{hw:17,h:22}};
let obstacles=[],obstEnd=350;
function genObstacles(upTo){
  const cfg=getLvlCfg(currentLevel);
  while(obstEnd<upTo){
    obstEnd+=cfg.obstGap+Math.random()*160;
    if(inGap(obstEnd)||inGap(obstEnd-60)||inGap(obstEnd+60))continue;
    if(Math.abs(tRaw(obstEnd).ang)>0.26)continue;
    const types=['rock','rock']; // rocks always available
    if(cfg.hasLog)types.push('log','log');
    if(cfg.hasStump)types.push('stump');
    if(cfg.hasCrate)types.push('crate');
    obstacles.push({x:obstEnd,type:types[Math.floor(Math.random()*types.length)]});
  }
  obstacles=obstacles.filter(o=>o.x>camX-150);
}

// ── FX: particles, popups, trail, fireflies, clouds ───────────────
let parts=[],popups=[],trail=[],flies=[],clouds=[];
function addParts(x,y,n,col,spd,glow){
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*spd,vy:-Math.random()*spd,
    life:1,dec:0.020+Math.random()*0.040,r:1.5+Math.random()*3,col,glow:!!glow});
}
function addPopup(x,y,txt){popups.push({x,y,txt,life:1});}
function updateFX(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.24*dt;p.life-=p.dec*dt;}
  parts=parts.filter(p=>p.life>0);
  for(const p of popups){p.y-=1.2*dt;p.life-=0.015*dt;}
  popups=popups.filter(p=>p.life>0);
  const na=nightAmt(dayTime);
  if(state==='playing'&&na>0.45&&flies.length<22&&Math.random()<0.10*dt){
    const x=camX+W*0.3+Math.random()*W*0.9;
    flies.push({x,y:tInfo(x).y-15-Math.random()*90,t:Math.random()*100,life:1});
  }
  for(const f of flies){f.t+=dt;f.x+=Math.sin(f.t*0.045)*0.5*dt;f.y+=Math.cos(f.t*0.06)*0.4*dt;f.life-=0.0022*dt;}
  flies=flies.filter(f=>f.life>0&&f.x>camX-60);
}
function initClouds(){
  clouds=[];
  for(let i=0;i<7;i++)clouds.push({x:Math.random()*2400,y:H*(0.04+Math.random()*0.20),
    sc:0.4+Math.random()*0.9,par:0.06+Math.random()*0.12,dr:0.05+Math.random()*0.10,al:0.3+Math.random()*0.28});
}

// ── characters ────────────────────────────────────────────────────
const CHARS=[
  {col:'#3d8fff',dark:'#1a5ccc',ac:'#ffd28a',name:'Alex',  cost:0  },
  {col:'#ff4f4f',dark:'#cc1a1a',ac:'#ffe2b0',name:'Nova',  cost:50 },
  {col:'#44d95a',dark:'#1aaa38',ac:'#c8f5ff',name:'Sylvan',cost:200},
];

// ── player ────────────────────────────────────────────────────────
let pl={},scarf=[];
function initPlayer(){
  const sx=160,ti=tInfo(sx);
  pl={x:sx,y:ti.y-PLR_H,vx:0,vy:0,angle:ti.ang,
    spinV:0,spinTotal:0,onGround:true,dead:false,
    holding:false,speed:getLvlCfg(currentLevel).minSpd+1,
    char:selectedChar,dustT:0,airT:0};
  scarf=[];for(let i=0;i<10;i++)scarf.push({x:sx,y:ti.y-PLR_H-26});
  trail=[];
}
function updateScarf(dt){
  // neck attachment point in world space
  const a=pl.angle;
  const nx=pl.x+4*Math.cos(a)+26*Math.sin(a);
  const ny=pl.y+PLR_H+4*Math.sin(a)-26*Math.cos(a);
  scarf[0].x=nx;scarf[0].y=ny;
  for(let i=1;i<scarf.length;i++){
    const s=scarf[i],p=scarf[i-1];
    s.x-=(pl.speed*0.6+0.4)*dt;
    s.y+=0.30*dt+Math.sin(Date.now()*0.007+i)*0.22;
    const dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy)||1;
    if(d>6.5){s.x=p.x+dx/d*6.5;s.y=p.y+dy/d*6.5;}
  }
}
function updatePlayer(dt){
  if(pl.dead)return;
  const cfg=getLvlCfg(currentLevel);
  if(pl.onGround){
    const ti=tInfo(pl.x),sl=ti.ang;
    pl.speed+=SLOPE_A*Math.sin(sl)*dt+PEDAL_A*dt;
    pl.speed=clamp(pl.speed,cfg.minSpd,SPD_MAX);
    pl.x+=pl.speed*Math.cos(sl)*dt;
    const t2=tInfo(pl.x);
    pl.y=t2.y-PLR_H;
    pl.angle+=angNorm(t2.ang-pl.angle)*Math.min(1,0.30*dt);
    pl.vy=0;pl.spinV=0;pl.spinTotal=0;pl.airT=0;
    pl.dustT-=dt;
    if(pl.dustT<=0&&pl.speed>7){pl.dustT=6;addParts(pl.x-16,t2.y,2,'rgba(140,120,80,.55)',2.5);}
    if(pl.holding){
      pl.vy=pl.speed*Math.sin(t2.ang)+JUMP_V-pl.speed*0.20;
      pl.vx=pl.speed*Math.cos(t2.ang);
      pl.onGround=false;
      addParts(pl.x,t2.y,8,'rgba(140,120,80,.6)',5);
    }
  } else {
    pl.airT+=dt;
    pl.vy=Math.min(pl.vy+GRAVITY*dt,18);
    pl.x+=pl.vx*dt;pl.y+=pl.vy*dt;
    // spin only when holding, NO auto-leveling
    if(pl.holding&&pl.airT>2){
      pl.spinV=Math.min(pl.spinV+SPIN_ACC*dt,SPIN_MAX);
    } else {
      pl.spinV*=Math.pow(0.90,dt); // slow decay
    }
    pl.angle+=pl.spinV*dt;pl.spinTotal+=pl.spinV*dt;
    const ti=tInfo(pl.x);
    if(pl.y>=ti.y-PLR_H){
      pl.y=ti.y-PLR_H;
      const sl=ti.ang;
      const diff=angNorm(pl.angle-sl);
      // crash ONLY if was actually spinning AND landed badly inverted
      // normal jump (no spin) is always safe — just like Alto's Adventure
      const wasSpinning=Math.abs(pl.spinTotal)>Math.PI*0.30;
      if(wasSpinning&&Math.abs(diff)>Math.PI*0.54&&pl.vy>5.0){
        killPlayer();return;
      }
      const flips=Math.floor(Math.abs(pl.spinTotal)/(Math.PI*2));
      if(flips>0){
        const bonus=flips*150;score+=bonus;
        pl.speed=clamp(pl.speed+1.5*flips,cfg.minSpd,SPD_MAX);
        addParts(pl.x,ti.y-28,18,'#FFD700',9,true);
        addPopup(pl.x,ti.y-72,(flips===1?'Backflip!':flips+'x Flip!')+'  +'+bonus);
      }
      if(pl.vy>10)addParts(pl.x,ti.y,10,'rgba(140,120,80,.5)',5);
      pl.onGround=true;pl.angle=ti.ang;pl.spinV=0;pl.spinTotal=0;
    }
    if(pl.y>camY+H+150)killPlayer();
  }
  checkObstacles();
  trail.push({x:pl.x,y:pl.y+PLR_H,air:!pl.onGround});
  if(trail.length>28)trail.shift();
  updateScarf(dt);
}
function checkObstacles(){
  if(pl.dead)return;
  const pb=pl.y+PLR_H+12,pr=pl.x+20,pl2=pl.x-16;
  for(const obs of obstacles){
    if(Math.abs(obs.x-pl.x)>60)continue;
    const ty=tInfo(obs.x).y;
    const{hw,h}=OBS[obs.type];
    if(pr>obs.x-hw+6&&pl2<obs.x+hw-6&&pb>ty-h+5){killPlayer();return;}
  }
}
function killPlayer(){
  if(pl.dead)return;pl.dead=true;
  addParts(pl.x,pl.y,26,'#bbb',9);addParts(pl.x,pl.y,14,'#FFD700',7,true);
  if(score>highScore){highScore=Math.floor(score);localStorage.setItem('fr_hs',highScore);}
  totalCoins+=sesCoins;localStorage.setItem('fr_coins',totalCoins);
  setTimeout(()=>{if(state==='playing')state='dead';},900);
}
function completeLevel(){
  if(levelPending)return;levelPending=true;levelShowT=3.2;
  const prize=PRIZES[currentLevel-1];
  sesCoins+=prize.coins;totalCoins+=prize.coins;localStorage.setItem('fr_coins',totalCoins);
  if(prize.unlock!=null&&!unlockedChars.includes(prize.unlock)){
    unlockedChars.push(prize.unlock);localStorage.setItem('fr_chars',JSON.stringify(unlockedChars));
  }
  if(prize.boost)speedBoostActive=true;
  if(prize.badge){isLegend=true;localStorage.setItem('fr_legend','1');}
  for(let i=0;i<4;i++)setTimeout(()=>{
    addParts(pl.x+(Math.random()-.5)*60,pl.y-20+Math.random()*40,18,'#FFD700',11,true);
    addParts(pl.x+(Math.random()-.5)*60,pl.y-20,10,'rgba(120,220,255,.85)',8,true);
  },i*180);
}
function advanceLevel(){
  levelPending=false;
  if(currentLevel>=TOTAL_LEVELS){
    if(score>highScore){highScore=Math.floor(score);localStorage.setItem('fr_hs',highScore);}
    totalCoins+=sesCoins;localStorage.setItem('fr_coins',totalCoins);
    state='won';return;
  }
  currentLevel++;levelTimer=LEVEL_SEC;
  obstacles=obstacles.filter(o=>o.x>camX-60);
  obstEnd=Math.max(obstEnd,camX+W+300);
}

// ── update camera ──────────────────────────────────────────────────
function updateCamera(dt){
  if(pl.dead)return;
  const tx=pl.x-W*0.28;
  const ty=pl.y-H*0.38; // keep player at 38% from top (more sky, less terrain body)
  camX+=(tx-camX)*Math.min(1,0.09*dt);
  camY+=(ty-camY)*Math.min(1,0.06*dt);
}

// ── DRAW: backgrounds (pure screen space) ─────────────────────────
function drawSky(){
  const s=skyAt(dayTime),grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,s.a);grad.addColorStop(0.5,s.b);grad.addColorStop(1,s.c);
  g.fillStyle=grad;g.fillRect(0,0,W,H);
}
function drawStars(){
  const na=nightAmt(dayTime);if(na<0.02)return;
  g.save();
  for(let i=0;i<95;i++){
    const sx=((i*1637-camX*0.025)%(W+200)+W+200)%(W+200)-100;
    const sy=(i*983)%(H*0.60);
    g.globalAlpha=na*(0.5+0.5*Math.sin(Date.now()*0.0012+i*2.3))*0.9;
    g.fillStyle=i%5===0?'#ffedb0':'#fff';
    g.beginPath();g.arc(sx,sy,i%7===0?1.8:0.9,0,Math.PI*2);g.fill();
  }
  g.restore();
}
function drawCelestials(){
  const na=nightAmt(dayTime);
  if(na>0.02){
    const mt=((dayTime>=0.78?dayTime-0.78:dayTime+0.22)/0.44);
    const mx=W*(0.12+mt*0.76),my=H*(0.14+Math.sin(mt*Math.PI)*0.10);
    g.save();g.globalAlpha=na;
    const mg=g.createRadialGradient(mx,my,0,mx,my,90);
    mg.addColorStop(0,'rgba(210,225,255,.22)');mg.addColorStop(1,'rgba(210,225,255,0)');
    g.fillStyle=mg;g.beginPath();g.arc(mx,my,90,0,Math.PI*2);g.fill();
    g.fillStyle='#f4f2df';g.beginPath();g.arc(mx,my,26,0,Math.PI*2);g.fill();
    g.fillStyle=skyAt(dayTime).a;g.beginPath();g.arc(mx+13,my-7,21,0,Math.PI*2);g.fill();
    g.restore();
  }

function drawGaps(){

    const ly=tRaw(gap.s).y,ry=tRaw(gap.e).y;

    g.lineTo(gsx-10,lsy+28);g.closePath();g.fill();
    // right dirt edge

    g.lineTo(gex+10,rsy+28);g.closePath();g.fill();

    // jagged rocks left rim

    for(let i=0;i<3;i++){
      const rx=gsx+2+i*4,ry_=lsy-2-i*3;
      g.beginPath();g.moveTo(rx,lsy+2);g.lineTo(rx-4,ry_);g.lineTo(rx+4,ry_);g.closePath();g.fill();
    }

    for(let i=0;i<3;i++){
      const rx=gex-2-i*4,ry_=rsy-2-i*3;

function drawTerrain(){
  const na=nightAmt(dayTime),dk=duskAmt(dayTime);
  let topC=lerpHex('#243416','#0e1a28',na);topC=lerpHex(topC,'#3a281a',dk*0.3);
  let edge=lerpHex('#406030','#1e3448',na);edge=lerpHex(edge,'#7a5028',dk*0.45);
  const x0=camX-40,x1=camX+W+40,step=10;

  // Draw terrain in segments between gaps
  function drawSegment(xs,xe){
    g.beginPath();let started=false;
    for(let x=xs;x<=xe+step;x+=step){
      const cx=Math.min(x,xe);
      const sy_=wy(tRaw(cx).y),sx_=wx(cx);
      if(!started){g.moveTo(sx_,sy_);started=true;}else g.lineTo(sx_,sy_);
    }
    if(!started)return;
    const DEPTH=140;
    g.lineTo(wx(xe),wy(tRaw(xe).y)+DEPTH);
    for(let x=xe-step;x>=xs;x-=step){const cx=Math.max(x,xs);g.lineTo(wx(cx),wy(tRaw(cx).y)+DEPTH);}
    g.closePath();
    const midSY=wy(tRaw((xs+xe)*0.5).y);
    const tg=g.createLinearGradient(0,midSY-20,0,midSY+DEPTH);
    tg.addColorStop(0,topC);tg.addColorStop(1,lerpHex('#060c04','#020508',na));
    g.fillStyle=tg;g.fill();
    // edge stroke
    g.beginPath();started=false;
    for(let x=xs;x<=xe+step;x+=step){
      const cx=Math.min(x,xe);
      const sy_=wy(tRaw(cx).y),sx_=wx(cx);
      if(!started){g.moveTo(sx_,sy_);started=true;}else g.lineTo(sx_,sy_);
    }
    g.strokeStyle=edge;g.lineWidth=2.6;g.lineJoin='round';g.stroke();
    g.save();g.globalAlpha=0.20;g.lineWidth=6;g.stroke();g.restore();
  }

  // Collect all gap boundaries in view
  const cuts=[x0];
  for(const gap of gaps){
    if(gap.e<x0||gap.s>x1)continue;
    cuts.push(gap.s,gap.e);
  }
  cuts.push(x1);
  cuts.sort((a,b)=>a-b);
  for(let i=0;i<cuts.length-1;i+=2){
    if(!inGap((cuts[i]+cuts[i+1])/2))drawSegment(cuts[i],cuts[i+1]);
  }
}

  g.beginPath();g.moveTo(8,-22);g.lineTo(18,-18);g.stroke(); // handlebar
  // seat

  g.beginPath();g.moveTo(0,10);g.lineTo(-4,-6);g.stroke(); // seat post
  g.strokeStyle='#333';g.lineWidth=4;g.lineCap='round';
  g.beginPath();g.moveTo(-14,-8);g.lineTo(-2,-8);g.stroke(); // saddle

  // ── crank + pedals ────────────────────────────────────────────
  const pa=spR*0.68;

  // head + helmet
  g.save();g.translate(hipX,hipY);g.rotate(torsoAngle);
  g.fillStyle='#1a1a2a';g.beginPath();g.arc(1,-28,7.5,0,Math.PI*2);g.fill(); // head
  // helmet shell
  g.fillStyle=ch.col;
  g.beginPath();g.arc(1,-29.5,8,Math.PI*0.92,Math.PI*1.95);g.lineTo(1,-29.5);g.closePath();g.fill();
  // helmet visor
  g.fillStyle=ch.dark;
  g.beginPath();g.moveTo(-6,-24);g.lineTo(8,-24);g.lineTo(9,-22);g.lineTo(-7,-22);g.closePath();g.fill();
  // face highlight
  g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.arc(3,-28,4,Math.PI*1.1,Math.PI*1.7);g.fill();
  g.restore();

  g.globalAlpha=1;g.restore();

  // flip rings
  if(!pl.onGround&&pl.spinV>0.04){
    const flips=Math.floor(Math.abs(pl.spinTotal)/(Math.PI*2));
    if(flips>0){
      g.save();g.globalAlpha=0.45;g.strokeStyle='#FFD700';
      for(let i=0;i<flips;i++){g.lineWidth=2;g.beginPath();g.arc(px,wy(pl.y),26+i*10,0,Math.PI*2);g.stroke();}
      g.restore();
    }
  }
}
function drawParticles(){
  g.save();
  for(const p of parts){
    g.globalCompositeOperation=p.glow?'lighter':'source-over';
    g.globalAlpha=Math.max(0,p.life);g.fillStyle=p.col;
    g.beginPath();g.arc(wx(p.x),wy(p.y),p.r*p.life,0,Math.PI*2);g.fill();

}
function drawAtmo(){

function drawChars(){
  g.fillStyle='#070f1d';g.fillRect(0,0,W,H);
  const cx=W/2;g.save();g.textAlign='center';

    const ch=CHARS[i],unlocked=unlockedChars.includes(i),sel=selectedChar===i;

    g.fillStyle=ch.col;g.beginPath();g.arc(cx-cw/2+30,cy+ch2/2,14,0,Math.PI*2);g.fill();

    g.fillStyle=ch.ac;g.beginPath();g.arc(cx-cw/2+30,cy+ch2/2-10,5.5,0,Math.PI*2);g.fill();

// ── input ──────────────────────────────────────────────────────────
function hitMenu(x,y){
  const cx=W/2,bw=Math.min(W*.56,220),bh=60,by=H*.71;
  if(x>cx-bw/2&&x<cx+bw/2&&y>by&&y<by+bh)return'play';
  const cbw=Math.min(W*.46,178),cbh=44,cby=H*.84;
  if(x>cx-cbw/2&&x<cx+cbw/2&&y>cby&&y<cby+cbh)return'chars';
  return null;
}
function hitDead(x,y){
  const cx=W/2,bw=Math.min(W*.52,192),bh=56,by1=H*.66,by2=by1+bh+16;
  if(x>cx-bw/2&&x<cx+bw/2&&y>by1&&y<by1+bh)return'retry';
  if(x>cx-bw/2&&x<cx+bw/2&&y>by2&&y<by2+44)return'menu';
  return null;
}
function hitWon(x,y){
  const cx=W/2,bw=Math.min(W*.52,192),bh=56,by1=H*.65,by2=by1+bh+16;
  if(x>cx-bw/2&&x<cx+bw/2&&y>by1&&y<by1+bh)return'retry';
  if(x>cx-bw/2&&x<cx+bw/2&&y>by2&&y<by2+44)return'menu';
  return null;
}
function hitChars(x,y){
  const cx=W/2,cw=Math.min(W*.82,320),ch2=106,sy_=H*.15;
  for(let i=0;i<3;i++){const cy=sy_+i*(ch2+20);if(x>cx-cw/2&&x<cx+cw/2&&y>cy&&y<cy+ch2)return'char:'+i;}
  if(x>W/2-72&&x<W/2+72&&y>H*.90&&y<H*.90+46)return'back';
  return null;
}
function onPress(x,y){
  if(state==='playing'){
    if(levelPending){advanceLevel();return;}
    pl.holding=true;return;
  }
  let hit=null;
  if(state==='menu') hit=hitMenu(x,y);
  if(state==='dead') hit=hitDead(x,y);
  if(state==='won')  hit=hitWon(x,y);
  if(state==='chars')hit=hitChars(x,y);
  if(!hit)return;
  if(hit==='play'||hit==='retry'){startGame();return;}
  if(hit==='menu'){state='menu';return;}
  if(hit==='chars'){state='chars';return;}
  if(hit==='back'){state='menu';return;}
  if(hit.startsWith('char:')){
    const i=+hit.slice(5),ch=CHARS[i];
    if(unlockedChars.includes(i)){selectedChar=i;localStorage.setItem('fr_char',i);}
    else if(totalCoins>=ch.cost){
      totalCoins-=ch.cost;unlockedChars.push(i);selectedChar=i;
      localStorage.setItem('fr_coins',totalCoins);
      localStorage.setItem('fr_chars',JSON.stringify(unlockedChars));
      localStorage.setItem('fr_char',i);
    }
  }
}
function onRelease(){pl.holding=false;}
function coords(e,idx){
  const r=c.getBoundingClientRect();const src=idx!=null?e.changedTouches[idx]:e;
  return[(src.clientX-r.left)*(W/r.width),(src.clientY-r.top)*(H/r.height)];
}
c.addEventListener('touchstart',e=>{e.preventDefault();const[x,y]=coords(e,0);onPress(x,y);},{passive:false});
c.addEventListener('touchend',  e=>{e.preventDefault();onRelease();},{passive:false});
c.addEventListener('mousedown', e=>{const[x,y]=coords(e);onPress(x,y);});
c.addEventListener('mouseup',   ()=>onRelease());
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){if(state==='playing')pl.holding=true;else if(state==='menu')startGame();e.preventDefault();}
});
document.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')onRelease();});

// ── game start ─────────────────────────────────────────────────────
function startGame(){
  score=0;dist=0;sesCoins=0;camX=0;camY=0;
  currentLevel=1;levelTimer=LEVEL_SEC;levelPending=false;levelShowT=0;speedBoostActive=false;
  parts=[];popups=[];coins=[];trees=[];flies=[];obstacles=[];trail=[];scarf=[];
  gaps=[];gapFrontier=800;
  treeEnd=0;coinEnd=200;obstEnd=350;
  terrain=[];tLastX=0;tGenY=0;tTrend=0;tTC=0;
  genTerrain(W+900);initPlayer();
  camX=pl.x-W*0.28;camY=pl.y-H*0.44;
  genTrees(W+900);genCoins(W+900);genObstacles(W+900);genGaps(W+900);
  initClouds();state='playing';
}

// ── main loop ──────────────────────────────────────────────────────
let lastT=0;
function loop(now){
  const dt=Math.min((now-lastT)/16.667,3);lastT=now;
  g.clearRect(0,0,W,H);
  dayTime=(dayTime+DAY_SPD*dt)%1;

  if(state==='menu'){drawMenu();}
  else if(state==='playing'||state==='dead'){
    if(state==='playing'&&!levelPending&&!pl.dead){
      levelTimer-=dt/60;
      if(levelTimer<=0){levelTimer=0;completeLevel();}
    }
    if(state==='playing'&&levelPending){
      levelShowT-=dt/60;if(levelShowT<=0)advanceLevel();
    }
    if(state==='playing'){
      updatePlayer(dt);updateCamera(dt);
      if(!pl.dead){
        dist+=pl.speed*dt;score+=pl.speed*0.042*dt;
        genTerrain(camX+W+900);genTrees(camX+W+900);
        genCoins(camX+W+900);genObstacles(camX+W+900);genGaps(camX+W+900);
        // coin magnet + collect
        for(const cn of coins){
          if(cn.hit)continue;
          const dx=pl.x-cn.x,dy=(pl.y+PLR_H-14)-cn.y,d2=dx*dx+dy*dy;
          if(d2<MAG_R*MAG_R){const d=Math.sqrt(d2)||1;const pull=(1-d/MAG_R)*0.20*dt;cn.x+=dx*pull;cn.y+=dy*pull;}
          if(d2<COL_R*COL_R){cn.hit=true;sesCoins++;score+=12;addParts(cn.x,cn.y,8,'#FFD700',5,true);}
        }
      }
    }
    updateFX(dt);
    // draw
    drawSky();drawStars();drawCelestials();drawClouds();drawMountains();
    for(const t of trees)if(t.lay===0)drawTree(t);
    drawGaps();drawTerrain();
    for(const t of trees)if(t.lay===1)drawTree(t);
    for(const obs of obstacles)drawObstacle(obs);
    drawFlies();
    for(const cn of coins)drawCoin(cn);
    drawTrail();drawScarf();drawPlayer();drawParticles();
    drawAtmo();drawHUD();
    if(state==='playing'&&levelPending)drawLevelComplete();
    if(state==='dead')drawDead();
  }
  else if(state==='won'){drawWon();}
  else if(state==='chars'){drawChars();}
  requestAnimationFrame(loop);
}

genTerrain(W+900);
requestAnimationFrame(loop);
</script>
