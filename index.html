<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Forest Rider</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const c=document.getElementById('c');
const g=c.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=window.innerWidth;H=window.innerHeight;
  c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);
  c.style.width=W+'px';c.style.height=H+'px';
  g.setTransform(DPR,0,0,DPR,0,0);
}
resize();window.addEventListener('resize',resize);

// ── constants ──────────────────────────────────────────────────────
const GRAVITY=0.45,JUMP_V=-12.8,SPD_MIN=4.2,SPD_MAX=15;
const SLOPE_A=0.30,PEDAL_A=0.016,SPIN_ACC=0.022,SPIN_MAX=0.26;
const DAY_SPD=0.00012,SEG_W=80,PLR_H=18,MAG_R=128,COL_R=34;
const TOTAL_LEVELS=20,LEVEL_SEC=45;

// ── helpers ────────────────────────────────────────────────────────
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hexRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function lerpHex(a,b,t){
  const A=hexRgb(a),B=hexRgb(b);
  return'#'+(((Math.round(A[0]+(B[0]-A[0])*t))<<16)|((Math.round(A[1]+(B[1]-A[1])*t))<<8)|(Math.round(A[2]+(B[2]-A[2])*t))).toString(16).padStart(6,'0');
}
function hexA(h,a){const[r,gv,b]=hexRgb(h);return`rgba(${r},${gv},${b},${a})`;}
function angNorm(a){return((a%(Math.PI*2))+Math.PI*3)%(Math.PI*2)-Math.PI;}
function rr(x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);
  g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);
  g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);
  g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}

// ── sky palette ────────────────────────────────────────────────────
const SKY_K=[
  [0.00,'#050817','#0a1230','#16204a'],
  [0.16,'#1c0a3a','#55175a','#8f3a4a'],
  [0.25,'#4a2a6e','#e06a3a','#ffc168'],
  [0.34,'#3f8fd4','#7ec0ec','#d8efff'],
  [0.50,'#2f7ec8','#6fb4e8','#cfeaff'],
  [0.66,'#3f8fd4','#84b8e2','#ffd9a0'],
  [0.75,'#533070','#e0623a','#ff9d4a'],
  [0.84,'#1c0a3a','#3a1a55','#6e2a50'],
  [1.00,'#050817','#0a1230','#16204a'],
];
function skyAt(t){
  for(let i=0;i<SKY_K.length-1;i++){
    if(t>=SKY_K[i][0]&&t<=SKY_K[i+1][0]){
      let f=(t-SKY_K[i][0])/(SKY_K[i+1][0]-SKY_K[i][0]);
      f=f*f*(3-2*f);
      return{a:lerpHex(SKY_K[i][1],SKY_K[i+1][1],f),b:lerpHex(SKY_K[i][2],SKY_K[i+1][2],f),c:lerpHex(SKY_K[i][3],SKY_K[i+1][3],f)};
    }
  }
  return{a:SKY_K[0][1],b:SKY_K[0][2],c:SKY_K[0][3]};
}
function nightAmt(t){
  let v=0;if(t<0.22)v=1-t/0.22;else if(t>0.78)v=(t-0.78)/0.22;
  return v*v*(3-2*v);
}
function duskAmt(t){
  return Math.max(Math.max(0,1-Math.abs(t-0.245)/0.075),Math.max(0,1-Math.abs(t-0.755)/0.075));
}

// ── level system ───────────────────────────────────────────────────
let currentLevel=1,levelTimer=LEVEL_SEC,levelPending=false,levelShowT=0,speedBoostActive=false;
const PRIZES=[
  {coins:15},
  {coins:30},
  {coins:45},
  {coins:60},
  {coins:75, unlock:1, text:'Nova Unlocked!'},
  {coins:90},
  {coins:105},
  {coins:120},
  {coins:135},
  {coins:150,boost:true,text:'Speed Boost!'},
  {coins:165},
  {coins:180},
  {coins:195},
  {coins:210},
  {coins:225,unlock:2, text:'Sylvan Unlocked!'},
  {coins:240},
  {coins:255},
  {coins:270},
  {coins:285},
  {coins:500,badge:true,text:'Forest Legend!'},
];
function getLvlCfg(lv){
  return{
    obstGap:Math.max(260,580-lv*16),
    hasLog:lv>=4,hasStump:lv>=7,hasCrate:lv>=12,
    minSpd:SPD_MIN+(lv-1)*0.25+(speedBoostActive?1.5:0),
  };
}

// ── persistent ─────────────────────────────────────────────────────
let highScore=+localStorage.getItem('fr_hs')||0;
let totalCoins=+localStorage.getItem('fr_coins')||0;
let unlockedChars=JSON.parse(localStorage.getItem('fr_chars')||'[0]');
let selectedChar=+localStorage.getItem('fr_char')||0;
let isLegend=!!localStorage.getItem('fr_legend');

// ── runtime ────────────────────────────────────────────────────────
let state='menu',dayTime=0.40,camX=0,score=0,dist=0,sesCoins=0;

// ── terrain (Catmull-Rom, FIXED height range) ──────────────────────
let terrain=[],tLastX=0,tGenY=0,tTrend=0,tTC=0;
function tInfo(x){
  const n=terrain.length;
  if(n<4)return{y:H*0.46,ang:0};
  let i=Math.floor((x-terrain[0].x)/SEG_W);
  i=clamp(i,1,n-3);
  const p0=terrain[i-1].y,p1=terrain[i].y,p2=terrain[i+1].y,p3=terrain[i+2].y;
  const t=clamp((x-terrain[i].x)/SEG_W,0,1),t2=t*t,t3=t2*t;
  const y=0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
  const dy=0.5*((-p0+p2)+2*(2*p0-5*p1+4*p2-p3)*t+3*(-p0+3*p1-3*p2+p3)*t2)/SEG_W;
  return{y,ang:Math.atan(dy)};
}
function genTerrain(upTo){
  if(!terrain.length){
    tGenY=H*0.44;  // ← raised: was 0.58, now 0.44 so hills appear mid-screen
    for(let i=0;i<4;i++)terrain.push({x:-480+i*SEG_W,y:tGenY});
    tLastX=terrain[terrain.length-1].x;
  }
  const amp=1+Math.min(dist*0.00004,0.55)*(1+currentLevel*0.06);
  while(tLastX<upTo){
    tLastX+=SEG_W;tTC--;
    if(tTC<=0){tTrend=(Math.random()<0.46)?1:(Math.random()<0.5?0:-1);tTC=3+Math.floor(Math.random()*8);}
    const dy=(tTrend*(10+Math.random()*22)+(Math.random()-0.5)*14)*amp;
    tGenY=clamp(tGenY+dy,H*0.22,H*0.64);  // ← range shifted up
    terrain.push({x:tLastX,y:tGenY});
  }
  while(terrain.length>8&&terrain[1].x<camX-500)terrain.shift();
}

// ── trees ──────────────────────────────────────────────────────────
let trees=[],treeEnd=0;
function genTrees(upTo){
  while(treeEnd<upTo){
    treeEnd+=50+Math.random()*110;
    trees.push({x:treeEnd,y:tInfo(treeEnd).y,sc:0.5+Math.random()*1.0,
      k:Math.floor(Math.random()*3),lay:Math.random()<0.35?0:1,sh:0.85+Math.random()*0.3});
  }
  trees=trees.filter(t=>t.x>camX-280);
}

// ── coins (always above terrain) ──────────────────────────────────
let coins=[],coinEnd=200;
function genCoins(upTo){
  while(coinEnd<upTo){
    coinEnd+=150+Math.random()*220;
    if(Math.random()<0.5){
      const n=5+Math.floor(Math.random()*3);
      for(let i=0;i<n;i++){
        const x=coinEnd+i*42;
        const ty=tInfo(x).y;
        const h=36+Math.sin(i/(n-1)*Math.PI)*50;
        coins.push({x,y:ty-h,hit:false,ph:Math.random()*6.28});
      }
      coinEnd+=n*42;
    } else {
      const x=coinEnd,ty=tInfo(x).y;
      coins.push({x,y:ty-(34+Math.random()*48),hit:false,ph:Math.random()*6.28});
    }
  }
  // safety clamp — no coin underground
  for(const cn of coins){const ty=tInfo(cn.x).y;if(cn.y>ty-26)cn.y=ty-26;}
  coins=coins.filter(cn=>!cn.hit&&cn.x>camX-80);
}

// ── obstacles ─────────────────────────────────────────────────────
const OBS_DATA={rock:{hw:20,h:28},log:{hw:27,h:14},stump:{hw:12,h:22},crate:{hw:16,h:21}};
let obstacles=[],obstEnd=600;
function genObstacles(upTo){
  if(currentLevel<2){obstEnd=Math.max(obstEnd,upTo);return;}
  const cfg=getLvlCfg(currentLevel);
  while(obstEnd<upTo){
    obstEnd+=cfg.obstGap+Math.random()*180;
    const ang=tInfo(obstEnd).ang;
    if(Math.abs(ang)>0.30)continue;
    const types=['rock'];
    if(cfg.hasLog)types.push('log');
    if(cfg.hasStump)types.push('stump');
    if(cfg.hasCrate)types.push('crate');
    obstacles.push({x:obstEnd,type:types[Math.floor(Math.random()*types.length)]});
  }
  obstacles=obstacles.filter(o=>o.x>camX-120);
}
function checkObstacles(){
  if(pl.dead)return;
  const pb=pl.y+PLR_H+14,pr=pl.x+22,pl2=pl.x-18;
  for(const obs of obstacles){
    if(Math.abs(obs.x-pl.x)>55)continue;
    const ty=tInfo(obs.x).y,{hw,h}=OBS_DATA[obs.type];
    if(pr>obs.x-hw+4&&pl2<obs.x+hw-4&&pb>ty-h+4){killPlayer();return;}
  }
}

// ── particles / fx ────────────────────────────────────────────────
let parts=[],popups=[],trail=[],flies=[],clouds=[];
function addParts(x,y,n,col,spd,glow){
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*spd,vy:-Math.random()*spd,life:1,dec:0.022+Math.random()*0.04,r:1.5+Math.random()*3,col,glow:!!glow});
}
function updateParts(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.24*dt;p.life-=p.dec*dt;}
  parts=parts.filter(p=>p.life>0);
}
function addPopup(x,y,txt){popups.push({x,y,txt,life:1});}
function updatePopups(dt){for(const p of popups){p.y-=1.2*dt;p.life-=0.015*dt;}popups=popups.filter(p=>p.life>0);}
function updateFlies(dt){
  const na=nightAmt(dayTime);
  if(state==='playing'&&na>0.45&&flies.length<22&&Math.random()<0.10*dt){
    const x=camX+W*0.3+Math.random()*W*0.9;
    flies.push({x,y:tInfo(x).y-20-Math.random()*80,t:Math.random()*100,life:1});
  }
  for(const f of flies){f.t+=dt;f.x+=Math.sin(f.t*0.045)*0.5*dt;f.y+=Math.cos(f.t*0.06)*0.4*dt;f.life-=0.0025*dt;}
  flies=flies.filter(f=>f.life>0&&f.x>camX-50);
}
function initClouds(){
  clouds=[];
  for(let i=0;i<7;i++)clouds.push({x:Math.random()*2400,y:H*(0.03+Math.random()*0.18),sc:0.45+Math.random()*0.95,par:0.07+Math.random()*0.13,dr:0.05+Math.random()*0.11,al:0.35+Math.random()*0.30});
}

// ── characters ────────────────────────────────────────────────────
const CHARS=[
  {col:'#3d8fff',ac:'#ffd28a',name:'Alex',  cost:0  },
  {col:'#ff4f4f',ac:'#ffe2b0',name:'Nova',  cost:50 },
  {col:'#44d95a',ac:'#c8f5ff',name:'Sylvan',cost:200},
];

// ── player ────────────────────────────────────────────────────────
let pl={},scarf=[];
function initPlayer(){
  const sx=160,ti=tInfo(sx);
  pl={x:sx,y:ti.y-PLR_H,vx:0,vy:0,angle:ti.ang,spinV:0,spinTotal:0,
    onGround:true,dead:false,holding:false,speed:getLvlCfg(currentLevel).minSpd+1,
    char:selectedChar,dustT:0,airT:0};
  scarf=[];for(let i=0;i<9;i++)scarf.push({x:sx,y:ti.y-PLR_H-28});
  trail=[];
}
function neckPos(){
  const a=pl.angle;
  return[pl.x+4*Math.cos(a)+28*Math.sin(a), pl.y+PLR_H+4*Math.sin(a)-28*Math.cos(a)];
}
function updateScarf(dt){
  const[nx,ny]=neckPos();scarf[0].x=nx;scarf[0].y=ny;
  for(let i=1;i<scarf.length;i++){
    const s=scarf[i],p=scarf[i-1];
    s.x-=(pl.speed*0.55+0.5)*dt;
    s.y+=0.35*dt+Math.sin(Date.now()*0.008+i)*0.25;
    const dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy)||1;
    if(d>6.5){s.x=p.x+dx/d*6.5;s.y=p.y+dy/d*6.5;}
  }
}
function updatePlayer(dt){
  if(pl.dead)return;
  const cfg=getLvlCfg(currentLevel);
  if(pl.onGround){
    const ti=tInfo(pl.x),sl=ti.ang;
    pl.speed+=SLOPE_A*Math.sin(sl)*dt+PEDAL_A*dt;
    pl.speed=clamp(pl.speed,cfg.minSpd,SPD_MAX);
    pl.x+=pl.speed*Math.cos(sl)*dt;
    const t2=tInfo(pl.x);
    pl.y=t2.y-PLR_H;
    pl.angle+=angNorm(t2.ang-pl.angle)*Math.min(1,0.35*dt);
    pl.vy=0;pl.spinV=0;pl.spinTotal=0;pl.airT=0;
    pl.dustT-=dt;
    if(pl.dustT<=0&&pl.speed>7){pl.dustT=6;addParts(pl.x-16,t2.y,2,'rgba(150,128,90,.5)',2.5);}
    if(pl.holding){
      pl.vy=pl.speed*Math.sin(t2.ang)+JUMP_V-pl.speed*0.22;
      pl.vx=pl.speed*Math.cos(t2.ang);
      pl.onGround=false;
      addParts(pl.x,t2.y,7,'rgba(150,128,90,.55)',5);
    }
  } else {
    pl.airT+=dt;
    pl.vy=Math.min(pl.vy+GRAVITY*dt,17);
    pl.x+=pl.vx*dt;pl.y+=pl.vy*dt;
    if(pl.holding&&pl.airT>3){pl.spinV=Math.min(pl.spinV+SPIN_ACC*dt,SPIN_MAX);}
    else{
      pl.spinV*=Math.pow(0.86,dt);
      const ti=tInfo(pl.x);
      if(pl.vy>0&&ti.y-PLR_H-pl.y<110)pl.angle+=angNorm(ti.ang-pl.angle)*Math.min(1,0.10*dt);
    }
    pl.angle+=pl.spinV*dt;pl.spinTotal+=pl.spinV*dt;
    const ti=tInfo(pl.x);
    if(pl.y>=ti.y-PLR_H){
      pl.y=ti.y-PLR_H;
      const diff=angNorm(pl.angle-ti.ang);
      if(Math.abs(diff)>Math.PI*0.62&&pl.vy>6.5){
        killPlayer();
      } else {
        const flips=Math.floor(Math.abs(pl.spinTotal)/(Math.PI*2));
        if(flips>0){
          const bonus=flips*150;score+=bonus;
          pl.speed=clamp(pl.speed+1.6*flips,cfg.minSpd,SPD_MAX);
          addParts(pl.x,ti.y-28,16,'#FFD700',8,true);
          addPopup(pl.x,ti.y-70,(flips===1?'Backflip!':flips+'x Flip!')+'  +'+bonus);
        }
        if(pl.vy>9)addParts(pl.x,ti.y,8,'rgba(150,128,90,.5)',5);
        pl.onGround=true;pl.angle=ti.ang;pl.spinV=0;pl.spinTotal=0;
      }
    }
    if(pl.y>H+140)killPlayer();
  }
  checkObstacles();
  trail.push({x:pl.x,y:pl.y+PLR_H,air:!pl.onGround});
  if(trail.length>26)trail.shift();
  updateScarf(dt);
}
function killPlayer(){
  if(pl.dead)return;pl.dead=true;
  addParts(pl.x,pl.y,24,'#bbb',9);addParts(pl.x,pl.y,14,'#FFD700',6,true);
  if(score>highScore){highScore=Math.floor(score);localStorage.setItem('fr_hs',highScore);}
  totalCoins+=sesCoins;localStorage.setItem('fr_coins',totalCoins);
  setTimeout(()=>{if(state==='playing')state='dead';},900);
}
function completeLevel(){
  if(levelPending)return;levelPending=true;levelShowT=3.0;
  const prize=PRIZES[currentLevel-1];
  sesCoins+=prize.coins;totalCoins+=prize.coins;localStorage.setItem('fr_coins',totalCoins);
  if(prize.unlock!==undefined&&!unlockedChars.includes(prize.unlock)){
    unlockedChars.push(prize.unlock);localStorage.setItem('fr_chars',JSON.stringify(unlockedChars));
  }
  if(prize.boost)speedBoostActive=true;
  if(prize.badge){isLegend=true;localStorage.setItem('fr_legend','1');}
  for(let i=0;i<3;i++)setTimeout(()=>{
    addParts(pl.x,pl.y-20,20,'#FFD700',10,true);
    addParts(pl.x,pl.y-20,10,'rgba(120,220,255,.8)',8,true);
  },i*200);
}
function advanceLevel(){
  levelPending=false;
  if(currentLevel>=TOTAL_LEVELS){
    if(score>highScore){highScore=Math.floor(score);localStorage.setItem('fr_hs',highScore);}
    totalCoins+=sesCoins;localStorage.setItem('fr_coins',totalCoins);
    state='won';return;
  }
  currentLevel++;levelTimer=LEVEL_SEC;
  obstacles=obstacles.filter(o=>o.x>camX-50);
  obstEnd=Math.max(obstEnd,camX+W+300);
}

// ── draw: sky / environment ───────────────────────────────────────
function drawSky(){
  const s=skyAt(dayTime),grad=g.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,s.a);grad.addColorStop(0.55,s.b);grad.addColorStop(1,s.c);
  g.fillStyle=grad;g.fillRect(0,0,W,H);
}
function drawStars(){
  const na=nightAmt(dayTime);if(na<=0.02)return;
  g.save();
  for(let i=0;i<90;i++){
    const sx=((i*1637-camX*0.03)%(W+200)+W+200)%(W+200)-100;
    const sy=(i*983)%(H*0.48);
    g.globalAlpha=na*(0.5+0.5*Math.sin(Date.now()*0.0012+i*2.3))*0.9;
    g.fillStyle=i%5===0?'#ffedb0':'#fff';
    g.beginPath();g.arc(sx,sy,i%7===0?1.8:1,0,Math.PI*2);g.fill();
  }
  g.restore();
}
function drawCelestials(){
  const na=nightAmt(dayTime);
  if(na>0.02){
    const mt=((dayTime>=0.78?dayTime-0.78:dayTime+0.22)/0.44);
    const mx=W*(0.12+mt*0.76),my=H*0.26-Math.sin(mt*Math.PI)*H*0.14;
    g.save();g.globalAlpha=na;
    const mg=g.createRadialGradient(mx,my,0,mx,my,80);
    mg.addColorStop(0,'rgba(220,230,255,.25)');mg.addColorStop(1,'rgba(220,230,255,0)');
    g.fillStyle=mg;g.beginPath();g.arc(mx,my,80,0,Math.PI*2);g.fill();
    g.fillStyle='#f5f3e0';g.beginPath();g.arc(mx,my,26,0,Math.PI*2);g.fill();
    g.fillStyle=skyAt(dayTime).a;g.beginPath();g.arc(mx+13,my-7,21,0,Math.PI*2);g.fill();
    g.restore();
  }
  let sa=0;if(dayTime>=0.20&&dayTime<=0.80)sa=Math.sin((dayTime-0.20)/0.60*Math.PI);
  if(sa>0.01){
    const sx=W*(0.10+(dayTime-0.20)/0.60*0.80),sy=H*0.38-sa*H*0.26;
    const dk=duskAmt(dayTime),core=lerpHex('#FFE94a','#ff7430',dk);
    g.save();g.globalAlpha=Math.min(1,sa*1.5);
    const gl=g.createRadialGradient(sx,sy,0,sx,sy,130);
    gl.addColorStop(0,hexA(core,0.28));gl.addColorStop(1,hexA(core,0));
    g.fillStyle=gl;g.beginPath();g.arc(sx,sy,130,0,Math.PI*2);g.fill();
    const gl2=g.createRadialGradient(sx,sy,0,sx,sy,38);
    gl2.addColorStop(0,core);gl2.addColorStop(0.7,core);gl2.addColorStop(1,hexA(core,0));
    g.fillStyle=gl2;g.beginPath();g.arc(sx,sy,38,0,Math.PI*2);g.fill();
    g.restore();
  }
}
function drawClouds(){
  const na=nightAmt(dayTime),dk=duskAmt(dayTime);
  let col=lerpHex('#ffffff','#dd9468',dk);col=lerpHex(col,'#27355a',na);
  const t=Date.now()*0.001;
  for(const cl of clouds){
    const span=W+500;
    const sx=(((cl.x-camX*cl.par+t*cl.dr*30)%span)+span)%span-250;
    g.save();g.globalAlpha=cl.al*(0.40-na*0.18);g.fillStyle=col;
    g.translate(sx,cl.y);g.scale(cl.sc,cl.sc);
    g.beginPath();g.arc(0,0,32,0,Math.PI*2);g.arc(28,6,25,0,Math.PI*2);
    g.arc(-30,8,22,0,Math.PI*2);g.arc(7,-13,22,0,Math.PI*2);
    g.fill();g.restore();
  }

  const by2=by1+bh+16;
  g.fillStyle='rgba(255,255,255,.12)';rr(cx-bw/2,by2,bw,44,22);g.fill();
  g.fillStyle='#fff';g.font=`${Math.round(H*.030)}px -apple-system,sans-serif`;g.fillText('Menu',cx,by2+29);
  g.restore();
}
function drawWon(){
  g.fillStyle='rgba(2,4,10,.78)';g.fillRect(0,0,W,H);
  const cx=W/2;
  g.save();g.textAlign='center';
  g.fillStyle='#FFD700';g.font=`bold ${Math.round(H*.036)}px -apple-system,sans-serif`;
  g.fillText('★  FOREST LEGEND  ★',cx,H*.20);
  g.fillStyle='#fff';g.font=`bold ${Math.round(H*.068)}px -apple-system,sans-serif`;
  g.fillText('All 20 Levels!',cx,H*.32);
  g.fillStyle='#FFD700';g.font=`bold ${Math.round(H*.085)}px -apple-system,sans-serif`;
  g.fillText(Math.floor(score),cx,H*.46);
  if(Math.floor(score)>=highScore){g.fillStyle='#7ee04e';g.font=`${Math.round(H*.032)}px -apple-system,sans-serif`;g.fillText('New High Score!',cx,H*.54);}
  g.fillStyle='rgba(255,255,255,.58)';g.font=`${Math.round(H*.030)}px -apple-system,sans-serif`;g.fillText('● '+sesCoins+' coins earned',cx,H*.60);
  const bw=Math.min(W*.52,192),bh=56,by1=H*.67;
  g.fillStyle='#58c23a';rr(cx-bw/2,by1,bw,bh,bh/2);g.fill();
  g.fillStyle='#fff';g.font=`bold ${Math.round(H*.037)}px -apple-system,sans-serif`;g.fillText('Play Again',cx,by1+bh*.64);
  const by2=by1+bh+16;
  g.fillStyle='rgba(255,255,255,.12)';rr(cx-bw/2,by2,bw,44,22);g.fill();
  g.fillStyle='#fff';g.font=`${Math.round(H*.030)}px -apple-system,sans-serif`;g.fillText('Menu',cx,by2+29);
  g.restore();
}
function drawChars(){
  g.fillStyle='#070f1d';g.fillRect(0,0,W,H);
  const cx=W/2;
  g.save();g.textAlign='center';
  g.fillStyle='#fff';g.font=`bold ${Math.round(H*.056)}px -apple-system,sans-serif`;
  g.fillText('Characters',cx,H*.10);
  const cw=Math.min(W*.82,320),ch2=106,sy=H*.15;
  for(let i=0;i<3;i++){
    const ch=CHARS[i],unlocked=unlockedChars.includes(i),sel=selectedChar===i;
    const cy=sy+i*(ch2+20);
    g.fillStyle=sel?'rgba(100,200,80,.18)':'rgba(255,255,255,.06)';
    rr(cx-cw/2,cy,cw,ch2,14);g.fill();
    g.strokeStyle=sel?'#72d44e':'rgba(255,255,255,.18)';g.lineWidth=sel?2:1;g.stroke();
    g.fillStyle=ch.col;g.beginPath();g.arc(cx-cw/2+30,cy+ch2/2,13,0,Math.PI*2);g.fill();
    g.fillStyle=ch.ac;g.beginPath();g.arc(cx-cw/2+30,cy+ch2/2-9,5,0,Math.PI*2);g.fill();
    g.fillStyle=unlocked?'#fff':'rgba(255,255,255,.32)';
    g.font=`bold ${Math.round(H*.040)}px -apple-system,sans-serif`;
    g.textAlign='left';g.fillText(ch.name,cx-cw/2+58,cy+46);
    g.textAlign='right';
    if(unlocked){
      if(sel){g.fillStyle='#72d44e';g.font=`bold ${Math.round(H*.028)}px -apple-system,sans-serif`;g.fillText('Active',cx+cw/2-18,cy+46);}
      else{g.fillStyle='rgba(255,255,255,.45)';g.font=`${Math.round(H*.026)}px -apple-system,sans-serif`;g.fillText('Tap to use',cx+cw/2-18,cy+46);}
    } else {
      g.fillStyle='#FFD700';g.font=`${Math.round(H*.030)}px -apple-system,sans-serif`;g.fillText('● '+ch.cost,cx+cw/2-18,cy+40);
      const canBuy=totalCoins>=ch.cost;
      g.fillStyle=canBuy?'rgba(90,240,120,.8)':'rgba(255,90,90,.7)';
      g.font=`${Math.round(H*.025)}px -apple-system,sans-serif`;
      g.fillText(canBuy?'Tap to unlock':'Need '+(ch.cost-totalCoins)+' more',cx+cw/2-18,cy+66);
    }
    g.textAlign='center';
  }
  g.fillStyle='#FFD700';g.font=`${Math.round(H*.030)}px -apple-system,sans-serif`;
  g.fillText('● '+totalCoins+' coins',cx,sy+3*(ch2+20)+22);
  const bby=H*.90;
  g.fillStyle='rgba(255,255,255,.12)';rr(cx-72,bby,144,46,23);g.fill();
  g.fillStyle='#fff';g.font=`${Math.round(H*.030)}px -apple-system,sans-serif`;g.fillText('Back',cx,bby+30);
  g.restore();
}

// ── input ──────────────────────────────────────────────────────────
function hitMenu(x,y){
  const cx=W/2,bw=Math.min(W*.56,220),bh=60,by=H*.72;
  if(x>cx-bw/2&&x<cx+bw/2&&y>by&&y<by+bh)return'play';
  const cbw=Math.min(W*.46,180),cbh=44,cby=H*.84;
  if(x>cx-cbw/2&&x<cx+cbw/2&&y>cby&&y<cby+cbh)return'chars';
  return null;
}
function hitDead(x,y){
  const cx=W/2,bw=Math.min(W*.52,192),bh=56,by1=H*.65,by2=by1+bh+16;
  if(x>cx-bw/2&&x<cx+bw/2&&y>by1&&y<by1+bh)return'retry';
  if(x>cx-bw/2&&x<cx+bw/2&&y>by2&&y<by2+44)return'menu';
  return null;
}
function hitWon(x,y){
  const cx=W/2,bw=Math.min(W*.52,192),bh=56,by1=H*.67,by2=by1+bh+16;
  if(x>cx-bw/2&&x<cx+bw/2&&y>by1&&y<by1+bh)return'retry';
  if(x>cx-bw/2&&x<cx+bw/2&&y>by2&&y<by2+44)return'menu';
  return null;
}
function hitChars(x,y){
  const cx=W/2,cw=Math.min(W*.82,320),ch2=106,sy=H*.15;
  for(let i=0;i<3;i++){const cy=sy+i*(ch2+20);if(x>cx-cw/2&&x<cx+cw/2&&y>cy&&y<cy+ch2)return'char:'+i;}
  if(x>W/2-72&&x<W/2+72&&y>H*.90&&y<H*.90+46)return'back';
  return null;
}
function onPress(x,y){
  if(state==='playing'){
    if(levelPending){advanceLevel();return;}
    pl.holding=true;return;
  }
  let hit=null;
  if(state==='menu')  hit=hitMenu(x,y);
  if(state==='dead')  hit=hitDead(x,y);
  if(state==='won')   hit=hitWon(x,y);
  if(state==='chars') hit=hitChars(x,y);
  if(!hit)return;
  if(hit==='play'||hit==='retry'){startGame();return;}
  if(hit==='menu'){state='menu';return;}
  if(hit==='chars'){state='chars';return;}
  if(hit==='back'){state='menu';return;}
  if(hit.startsWith('char:')){
    const i=+hit.slice(5),ch=CHARS[i];
    if(unlockedChars.includes(i)){selectedChar=i;localStorage.setItem('fr_char',i);}
    else if(totalCoins>=ch.cost){
      totalCoins-=ch.cost;unlockedChars.push(i);selectedChar=i;
      localStorage.setItem('fr_coins',totalCoins);
      localStorage.setItem('fr_chars',JSON.stringify(unlockedChars));
      localStorage.setItem('fr_char',i);
    }
  }
}
function onRelease(){pl.holding=false;}
function coords(e,idx){
  const r=c.getBoundingClientRect();
  const src=idx!==undefined?e.changedTouches[idx]:e;
  return[(src.clientX-r.left)*(W/r.width),(src.clientY-r.top)*(H/r.height)];
}
c.addEventListener('touchstart',e=>{e.preventDefault();const[x,y]=coords(e,0);onPress(x,y);},{passive:false});
c.addEventListener('touchend',  e=>{e.preventDefault();onRelease();},{passive:false});
c.addEventListener('mousedown', e=>{const[x,y]=coords(e);onPress(x,y);});
c.addEventListener('mouseup',   ()=>onRelease());
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    if(state==='playing')pl.holding=true;else if(state==='menu')startGame();e.preventDefault();
  }
});
document.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')onRelease();});

// ── game init ──────────────────────────────────────────────────────
function startGame(){
  score=0;dist=0;sesCoins=0;camX=0;
  currentLevel=1;levelTimer=LEVEL_SEC;levelPending=false;levelShowT=0;speedBoostActive=false;
  parts=[];popups=[];coins=[];trees=[];flies=[];obstacles=[];
  treeEnd=0;coinEnd=200;obstEnd=600;
  terrain=[];tLastX=0;tGenY=0;tTrend=0;tTC=0;
  genTerrain(W+800);
  initPlayer();
  genTrees(W+800);genCoins(W+800);genObstacles(W+800);
  initClouds();state='playing';
}

// ── main loop ──────────────────────────────────────────────────────
let lastT=0;
function loop(now){
  const dt=Math.min((now-lastT)/16.667,3);lastT=now;
  g.clearRect(0,0,W,H);
  dayTime=(dayTime+DAY_SPD*dt)%1;

  if(state==='menu'){
    drawMenu();
  } else if(state==='playing'){
    if(!levelPending&&!pl.dead){
      levelTimer-=dt/60;
      if(levelTimer<=0){levelTimer=0;completeLevel();}
    }
    if(levelPending){
      levelShowT-=dt/60;
      if(levelShowT<=0)advanceLevel();
    }
    updatePlayer(dt);
    if(!pl.dead){
      camX+=((pl.x-W*0.30)-camX)*Math.min(1,0.09*dt);
      dist+=pl.speed*dt;score+=pl.speed*0.042*dt;
      genTerrain(camX+W+900);genTrees(camX+W+900);
      genCoins(camX+W+900);genObstacles(camX+W+900);
      // coin magnet + collect
      for(const cn of coins){
        if(cn.hit)continue;
        const dx=pl.x-cn.x,dy=(pl.y+PLR_H-12)-cn.y,d2=dx*dx+dy*dy;
        if(d2<MAG_R*MAG_R){const d=Math.sqrt(d2)||1;const pull=(1-d/MAG_R)*0.22*dt;cn.x+=dx*pull;cn.y+=dy*pull;}
        if(d2<COL_R*COL_R){cn.hit=true;sesCoins++;score+=12;addParts(cn.x,cn.y,8,'#FFD700',5,true);}
      }
    }
    updateParts(dt);updatePopups(dt);updateFlies(dt);
    drawSceneBG();
    for(const t of trees)if(t.lay===0)drawTree(t);
    drawTerrain();
    for(const t of trees)if(t.lay===1)drawTree(t);
    for(const obs of obstacles)drawObstacle(obs);
    drawFlies();
    for(const cn of coins)drawCoin(cn);
    drawTrail();drawScarf();drawPlayer();drawParticles();
    drawAtmo();drawHUD();
    if(levelPending)drawLevelComplete();
  } else if(state==='dead'){
    updateParts(dt);
    drawSceneBG();
    for(const t of trees)if(t.lay===0)drawTree(t);
    drawTerrain();
    for(const t of trees)if(t.lay===1)drawTree(t);
    for(const obs of obstacles)drawObstacle(obs);
    drawFlies();
    for(const cn of coins)drawCoin(cn);
    drawTrail();drawScarf();drawPlayer();drawParticles();
    drawAtmo();drawHUD();
    drawDead();
  } else if(state==='won'){
    drawSceneBG();drawMountains&&null;drawAtmo();
    drawWon();
  } else if(state==='chars'){
    drawChars();
  }
  requestAnimationFrame(loop);
}

genTerrain(W+800);
requestAnimationFrame(loop);
</script>
