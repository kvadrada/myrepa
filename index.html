<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mischief Cat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #FFF8F0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.screen {
  display: none;
  width: 100%;
  max-width: 460px;
  padding: 24px 20px;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  justify-content: center;
}
.screen.active { display: flex; }

/* ── Title ─────────────────────────────────────────── */
#title-screen { gap: 24px; text-align: center; }

.cat-hero {
  font-size: 90px;
  line-height: 1;
  animation: float 3s ease-in-out infinite;
  display: block;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-14px); }
}

h1 {
  font-size: 2.6rem;
  font-weight: 900;
  color: #1A1A2E;
  letter-spacing: -1.5px;
}
h1 span { color: #FF6B6B; }

.tagline {
  color: #999;
  font-size: 0.95rem;
  letter-spacing: 0.3px;
}

/* ── Buttons ───────────────────────────────────────── */
.btn {
  background: #FF6B6B;
  color: #fff;
  border: none;
  padding: 14px 40px;
  border-radius: 50px;
  font-size: 1.05rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
  box-shadow: 0 5px 0 #C94F4F;
  letter-spacing: 0.3px;
}
.btn:hover  { transform: translateY(-2px); box-shadow: 0 7px 0 #C94F4F; }
.btn:active { transform: translateY(3px);  box-shadow: 0 2px 0 #C94F4F; }

.btn-ghost {
  background: #F0EDE8;
  color: #666;
  box-shadow: 0 5px 0 #D9D4CD;
}
.btn-ghost:hover  { box-shadow: 0 7px 0 #D9D4CD; }
.btn-ghost:active { box-shadow: 0 2px 0 #D9D4CD; }

.btn-row { display: flex; gap: 12px; }

/* ── Level Select ──────────────────────────────────── */
#level-select-screen { gap: 24px; justify-content: flex-start; padding-top: 40px; }

.screen-title {
  font-size: 1.5rem;
  font-weight: 800;
  color: #1A1A2E;
}

.top-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}

.back-btn {
  background: #F0EDE8;
  border: none;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  flex-shrink: 0;
  transition: background 0.1s;
}
.back-btn:hover { background: #E5E0D9; }

.levels-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  width: 100%;
}

.lv-btn {
  aspect-ratio: 1;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: 700;
  transition: transform 0.1s, box-shadow 0.1s;
  color: #1A1A2E;
  gap: 3px;
  background: #fff;
  box-shadow: 0 3px 0 #E0D8D0;
}
.lv-btn:hover  { transform: translateY(-2px); box-shadow: 0 5px 0 #E0D8D0; }
.lv-btn:active { transform: translateY(2px);  box-shadow: 0 1px 0 #E0D8D0; }
.lv-btn.locked { background: #F0EDE8; color: #CCC; cursor: default; box-shadow: none; }
.lv-btn.locked:hover { transform: none; }
.lv-btn.done   { background: #E8F5E9; }
.lv-btn.perfect{ background: #FFFDE7; }

.lv-stars { font-size: 0.45rem; letter-spacing: 1px; }

/* ── Game Screen ───────────────────────────────────── */
#game-screen { gap: 14px; justify-content: flex-start; padding-top: 28px; }

.game-top {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.game-top .lv-tag {
  font-size: 0.8rem;
  font-weight: 700;
  color: #999;
  flex: 1;
}

.hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 10px;
}
.hud-card {
  background: #fff;
  border-radius: 18px;
  padding: 10px 14px;
  text-align: center;
  box-shadow: 0 3px 0 #E0D8D0;
  flex: 1;
}
.hud-label {
  font-size: 0.6rem;
  color: #BBB;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
}
.hud-value {
  font-size: 1.35rem;
  font-weight: 800;
  color: #1A1A2E;
  line-height: 1.1;
}
.cat-mood {
  font-size: 2.6rem;
  flex: 0 0 auto;
  transition: transform 0.2s;
}
.cat-mood.bounce { animation: catBounce 0.4s ease; }
@keyframes catBounce {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.25) rotate(-8deg); }
}

/* Progress bar */
.prog-wrap {
  width: 100%;
  height: 10px;
  background: #F0EDE8;
  border-radius: 99px;
  overflow: hidden;
}
.prog-bar {
  height: 100%;
  background: linear-gradient(90deg, #FF6B6B, #FF9F6B);
  border-radius: 99px;
  transition: width 0.45s cubic-bezier(.4,0,.2,1);
}

/* Grid */
.grid-wrap {
  position: relative;
  width: 100%;
}

#game-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 5px;
  background: #EDE9E3;
  padding: 10px;
  border-radius: 22px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.07);
}

.tile {
  aspect-ratio: 1;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  cursor: pointer;
  transition: transform 0.12s;
  user-select: none;
  position: relative;
  will-change: transform;
}
.tile:hover:not(.empty) { transform: scale(1.08); }
.tile.selected {
  transform: scale(1.13);
  box-shadow: 0 0 0 3px #fff, 0 0 0 5px #FF6B6B;
  z-index: 3;
}
.tile.matched { animation: pop 0.28s ease forwards; }
@keyframes pop {
  0%   { transform: scale(1);   opacity: 1; }
  45%  { transform: scale(1.35); opacity: 0.6; }
  100% { transform: scale(0);   opacity: 0; }
}
.tile.appear { animation: appear 0.22s ease-out; }
@keyframes appear {
  from { transform: scale(0) translateY(-20px); opacity: 0; }
  to   { transform: scale(1) translateY(0);     opacity: 1; }
}
.tile.shake { animation: shake 0.28s ease; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  30%      { transform: translateX(-5px); }
  70%      { transform: translateX(5px); }
}

/* Score popup */
.score-pop {
  position: absolute;
  font-size: 1rem;
  font-weight: 800;
  color: #FF6B6B;
  pointer-events: none;
  z-index: 20;
  white-space: nowrap;
  animation: scoreFloat 0.75s ease forwards;
}
@keyframes scoreFloat {
  0%   { transform: translateY(0) scale(1);    opacity: 1; }
  100% { transform: translateY(-52px) scale(0.8); opacity: 0; }
}

/* Bottom row */
.game-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.target-tag {
  font-size: 0.8rem;
  color: #AAA;
  font-weight: 600;
  flex: 1;
}
.mini-btn {
  background: #F0EDE8;
  border: none;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 700;
  color: #777;
  cursor: pointer;
}
.mini-btn:hover { background: #E5E0D9; }

/* ── Overlays ──────────────────────────────────────── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(20,20,30,0.55);
  align-items: center;
  justify-content: center;
  z-index: 200;
  backdrop-filter: blur(3px);
}
.overlay.active { display: flex; }

.ov-card {
  background: #fff;
  border-radius: 28px;
  padding: 36px 28px;
  text-align: center;
  width: min(320px, 90vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  animation: slideUp 0.3s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp {
  from { transform: translateY(30px) scale(0.95); opacity: 0; }
  to   { transform: translateY(0) scale(1);       opacity: 1; }
}
.ov-icon    { font-size: 72px; line-height: 1; }
.ov-title   { font-size: 1.8rem; font-weight: 900; color: #1A1A2E; }
.ov-stars   { font-size: 2rem; letter-spacing: 8px; }
.ov-score   { font-size: 2.4rem; font-weight: 900; color: #FF6B6B; }
.ov-sub     { font-size: 0.9rem; color: #AAA; }

/* ── Story toast ───────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1A1A2E;
  color: #fff;
  border-radius: 16px;
  padding: 12px 20px;
  font-size: 0.88rem;
  max-width: min(300px, 90vw);
  text-align: center;
  transition: transform 0.38s cubic-bezier(.4,0,.2,1);
  z-index: 100;
  pointer-events: none;
  line-height: 1.4;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ── Responsive ────────────────────────────────────── */
@media (max-width: 400px) {
  .tile       { font-size: 1.2rem; border-radius: 10px; }
  #game-grid  { gap: 3px; padding: 7px; }
  .hud-value  { font-size: 1.1rem; }
  h1          { font-size: 2.1rem; }
}
</style>
</head>
<body>

<!-- ── Title Screen ──────────────────────────────── -->
<div class="screen active" id="title-screen">
  <span class="cat-hero">😸</span>
  <div>
    <h1>Mischief <span>Cat</span></h1>
    <p class="tagline">A naughty cat's fishy adventure — 20 levels</p>
  </div>
  <button class="btn" onclick="showLevelSelect()">Play Now</button>
  <button class="btn btn-ghost" onclick="showLevelSelect()">Level Select</button>
</div>

<!-- ── Level Select ──────────────────────────────── -->
<div class="screen" id="level-select-screen">
  <div class="top-row">
    <button class="back-btn" onclick="showScreen('title-screen')">←</button>
    <span class="screen-title">Choose Level</span>
  </div>
  <div class="levels-grid" id="levels-grid"></div>
</div>

<!-- ── Game Screen ───────────────────────────────── -->
<div class="screen" id="game-screen">
  <div class="game-top">
    <button class="back-btn" onclick="confirmBack()">←</button>
    <span class="lv-tag" id="lv-label">Level 1</span>
  </div>

  <div class="hud">
    <div class="hud-card">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="hud-score">0</div>
    </div>
    <div class="cat-mood" id="cat-mood">😺</div>
    <div class="hud-card">
      <div class="hud-label">Moves</div>
      <div class="hud-value" id="hud-moves">30</div>
    </div>
  </div>

  <div class="prog-wrap">
    <div class="prog-bar" id="prog-bar" style="width:0%"></div>
  </div>

  <div class="grid-wrap">
    <div id="game-grid"></div>
  </div>

  <div class="game-footer">
    <span class="target-tag" id="target-tag">Target: 300</span>
    <button class="mini-btn" onclick="initLevel(currentLevel)">↺ Restart</button>
  </div>
</div>

<!-- ── Win Overlay ───────────────────────────────── -->
<div class="overlay" id="win-ov">
  <div class="ov-card">
    <div class="ov-icon" id="win-icon">😸</div>
    <div class="ov-title">Level Clear!</div>
    <div class="ov-stars" id="win-stars">⭐⭐⭐</div>
    <div class="ov-score" id="win-score">0</div>
    <div class="ov-sub" id="win-sub">The cat escapes with the loot!</div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="initLevel(currentLevel)">Retry</button>
      <button class="btn" id="next-btn" onclick="nextLevel()">Next →</button>
    </div>
  </div>
</div>

<!-- ── Lose Overlay ──────────────────────────────── -->
<div class="overlay" id="lose-ov">
  <div class="ov-card">
    <div class="ov-icon">😿</div>
    <div class="ov-title">Out of Moves!</div>
    <div class="ov-sub" id="lose-sub">So close...</div>
    <div class="ov-score" id="lose-score">0</div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="showLevelSelect()">Menu</button>
      <button class="btn" onclick="initLevel(currentLevel)">Try Again</button>
    </div>
  </div>
</div>

<!-- ── Toast ─────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
// ── Level data ────────────────────────────────────────────────────────────
const LEVELS = [
  { moves:30, target:300,   stars:[300,  600,   900],  story:"The cat eyes the fish bowl on the shelf... 👀" },
  { moves:28, target:500,   stars:[500,  900,  1400],  story:"Paw reaches out. The bowl wobbles dangerously." },
  { moves:27, target:700,   stars:[700, 1200,  1800],  story:"Unguarded sushi on the counter. Big mistake." },
  { moves:26, target:900,   stars:[900, 1500,  2200],  story:"A tuna can rolls across the kitchen floor." },
  { moves:25, target:1200,  stars:[1200,1900,  2700],  story:"Shrimp trail leads straight to the kitchen..." },
  { moves:25, target:1500,  stars:[1500,2300,  3200],  story:"The fridge door creaks open. Jackpot." },
  { moves:24, target:1900,  stars:[1900,2800,  3800],  story:"Owner's dinner plate — completely unguarded." },
  { moves:23, target:2300,  stars:[2300,3300,  4400],  story:"Midnight raid on the living room fish tank." },
  { moves:22, target:2700,  stars:[2700,3800,  5000],  story:"A whole salmon, just sitting there. Unbelievable." },
  { moves:22, target:3200,  stars:[3200,4400,  5800],  story:"The cat discovers the fish market's back alley." },
  { moves:20, target:3700,  stars:[3700,5000,  6500],  story:"Security guard: one very sleepy old dog. 🐶" },
  { moves:20, target:4300,  stars:[4300,5700,  7200],  story:"Bins overflowing with tuna cans. Heaven." },
  { moves:18, target:4900,  stars:[4900,6400,  8000],  story:"The storage room door hangs wide open..." },
  { moves:18, target:5600,  stars:[5600,7200,  9000],  story:"Alarm bells ring! But the cat is already gone." },
  { moves:17, target:6300,  stars:[6300,8000,  9800],  story:"Sprinting across rooftops with a mouthful of fish." },
  { moves:16, target:7100,  stars:[7100,8800, 10800],  story:"The chef gives chase through the entire kitchen!" },
  { moves:15, target:8000,  stars:[8000,9800, 11800],  story:"Cat scales the rooftop. Fish firmly in mouth." },
  { moves:14, target:9000,  stars:[9000,10900,13000],  story:"Every cat in the neighborhood watches in awe." },
  { moves:13, target:10200, stars:[10200,12000,14500], story:"One final heist. The legendary tuna vault awaits." },
  { moves:12, target:11500, stars:[11500,13500,16000], story:"The cat becomes a legend. 😸 The End." },
];

// Tiles: fish & snacks theme, 5 types
const EMOJIS  = ['🐟','🍣','🥫','🦐','🐡'];
const COLORS  = ['#C9E9FF','#FFD6E8','#C9FFE2','#FFE4C9','#E4C9FF'];
const GRID    = 8;

let board = [], selected = null, score = 0, moves = 0;
let currentLevel = 0, busy = false, progress = {};

try { progress = JSON.parse(localStorage.getItem('mischiefCat') || '{}'); } catch(_){}

function save(lvl, stars) {
  if ((progress[lvl] || 0) < stars) {
    progress[lvl] = stars;
    localStorage.setItem('mischiefCat', JSON.stringify(progress));
  }
}

// ── Screen helpers ────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showLevelSelect() {
  buildLevelGrid();
  showScreen('level-select-screen');
}

function buildLevelGrid() {
  const el = document.getElementById('levels-grid');
  el.innerHTML = '';
  LEVELS.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'lv-btn';
    const stars   = progress[i] || 0;
    const unlocked = i === 0 || (progress[i - 1] || 0) > 0;

    if (!unlocked) {
      btn.classList.add('locked');
      btn.innerHTML = '<span style="font-size:1.3rem">🔒</span>';
    } else {
      if (stars === 3) btn.classList.add('perfect');
      else if (stars > 0) btn.classList.add('done');
      const starsHtml = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
      btn.innerHTML = `<span>${i + 1}</span><span class="lv-stars">${starsHtml}</span>`;
      btn.onclick = () => startLevel(i);
    }
    el.appendChild(btn);
  });
}

// ── Level init ────────────────────────────────────────────────────────────
function startLevel(idx) {
  currentLevel = idx;
  showScreen('game-screen');
  initLevel(idx);
}

function initLevel(idx) {
  const lvl = LEVELS[idx];
  score = 0; moves = lvl.moves; selected = null; busy = false;
  closeOverlays();
  document.getElementById('lv-label').textContent = `Level ${idx + 1}`;
  document.getElementById('target-tag').textContent = `Target: ${lvl.target.toLocaleString()}`;
  updateHUD();
  makeBoard();
  render();
  setTimeout(() => toast(lvl.story), 500);
}

// ── Board generation ──────────────────────────────────────────────────────
function rng() { return Math.floor(Math.random() * EMOJIS.length); }

function makeBoard() {
  do {
    board = Array.from({length: GRID}, () => Array.from({length: GRID}, rng));
    removeInitialMatches();
  } while (!hasAnyMove());
}

function removeInitialMatches() {
  let changed = true;
  while (changed) {
    changed = false;
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        if (c >= 2 && board[r][c] === board[r][c-1] && board[r][c] === board[r][c-2]) {
          board[r][c] = rng(); changed = true;
        }
        if (r >= 2 && board[r][c] === board[r-1][c] && board[r][c] === board[r-2][c]) {
          board[r][c] = rng(); changed = true;
        }
      }
    }
  }
}

function hasAnyMove() {
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      if (c + 1 < GRID) {
        doSwapRaw(r,c,r,c+1);
        const ok = getMatches().length > 0;
        doSwapRaw(r,c,r,c+1);
        if (ok) return true;
      }
      if (r + 1 < GRID) {
        doSwapRaw(r,c,r+1,c);
        const ok = getMatches().length > 0;
        doSwapRaw(r,c,r+1,c);
        if (ok) return true;
      }
    }
  }
  return false;
}

function doSwapRaw(r1,c1,r2,c2) {
  [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
}

// ── Match logic ───────────────────────────────────────────────────────────
function getMatches() {
  const hit = new Set();
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID - 2; c++) {
      const t = board[r][c];
      if (t !== null && t === board[r][c+1] && t === board[r][c+2]) {
        let e = c+2;
        while (e+1 < GRID && board[r][e+1] === t) e++;
        for (let k = c; k <= e; k++) hit.add(r*GRID+k);
        c = e;
      }
    }
  }
  for (let c = 0; c < GRID; c++) {
    for (let r = 0; r < GRID - 2; r++) {
      const t = board[r][c];
      if (t !== null && t === board[r+1][c] && t === board[r+2][c]) {
        let e = r+2;
        while (e+1 < GRID && board[e+1][c] === t) e++;
        for (let k = r; k <= e; k++) hit.add(k*GRID+c);
        r = e;
      }
    }
  }
  return [...hit].map(i => ({ r: Math.floor(i/GRID), c: i%GRID }));
}

// ── Render ────────────────────────────────────────────────────────────────
function render(newCells = new Set()) {
  const el = document.getElementById('game-grid');
  el.innerHTML = '';
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const div = document.createElement('div');
      div.className = 'tile';
      div.dataset.r = r; div.dataset.c = c;
      const t = board[r][c];
      if (t !== null) {
        div.textContent = EMOJIS[t];
        div.style.background = COLORS[t];
        if (newCells.has(r*GRID+c)) div.classList.add('appear');
      } else {
        div.style.background = 'transparent';
        div.style.cursor = 'default';
      }
      div.addEventListener('click', () => onTile(r, c));
      el.appendChild(div);
    }
  }
}

function tileEl(r, c) {
  return document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

// ── Interaction ───────────────────────────────────────────────────────────
function onTile(r, c) {
  if (busy || moves <= 0) return;
  if (board[r][c] === null) return;

  if (!selected) {
    selected = {r, c};
    tileEl(r, c)?.classList.add('selected');
    return;
  }

  const {r:sr, c:sc} = selected;
  tileEl(sr, sc)?.classList.remove('selected');

  if (sr === r && sc === c) { selected = null; return; }

  const adjacent = Math.abs(sr-r) + Math.abs(sc-c) === 1;
  if (!adjacent) {
    selected = {r, c};
    tileEl(r, c)?.classList.add('selected');
    return;
  }

  selected = null;
  attemptSwap(sr, sc, r, c);
}

function attemptSwap(r1,c1,r2,c2) {
  busy = true;
  doSwapRaw(r1,c1,r2,c2);
  const matches = getMatches();

  if (!matches.length) {
    doSwapRaw(r1,c1,r2,c2);
    busy = false;
    [tileEl(r1,c1), tileEl(r2,c2)].forEach(el => {
      if (!el) return;
      el.classList.remove('shake');
      void el.offsetWidth;
      el.classList.add('shake');
    });
    return;
  }

  moves--;
  updateHUD();
  render();
  setTimeout(() => cascade(matches, 1), 160);
}

// ── Cascade ───────────────────────────────────────────────────────────────
async function cascade(matches, depth) {
  if (!matches.length) {
    busy = false;
    checkEnd();
    return;
  }

  const pts = calcPts(matches.length, depth);
  score += pts;
  updateHUD();
  showPop(matches, pts, depth);

  if (depth > 1 || matches.length >= 5) bounceCat();

  matches.forEach(({r,c}) => {
    tileEl(r,c)?.classList.add('matched');
    board[r][c] = null;
  });

  await wait(300);

  const newCells = drop();
  render(newCells);

  await wait(200);

  cascade(getMatches(), depth + 1);
}

function drop() {
  const newCells = new Set();
  for (let c = 0; c < GRID; c++) {
    let empty = GRID - 1;
    for (let r = GRID - 1; r >= 0; r--) {
      if (board[r][c] !== null) {
        board[empty][c] = board[r][c];
        if (empty !== r) board[r][c] = null;
        empty--;
      }
    }
    for (let r = empty; r >= 0; r--) {
      board[r][c] = rng();
      newCells.add(r*GRID+c);
    }
  }
  return newCells;
}

function calcPts(count, depth) {
  const base = count <= 3 ? 60 : count === 4 ? 120 : 180 + (count-5)*40;
  return Math.round(base * (depth === 1 ? 1 : depth * 1.25));
}

function showPop(matches, pts, depth) {
  const wrap = document.querySelector('.grid-wrap');
  const pop  = document.createElement('div');
  pop.className = 'score-pop';

  const avgR = matches.reduce((s,m)=>s+m.r,0)/matches.length;
  const avgC = matches.reduce((s,m)=>s+m.c,0)/matches.length;
  const gridEl = document.getElementById('game-grid');
  const cell = gridEl.offsetWidth / GRID;

  pop.style.left = (10 + avgC * cell + cell/2 - 24) + 'px';
  pop.style.top  = (10 + avgR * cell) + 'px';
  pop.textContent = (depth > 1 ? `×${depth} ` : '') + '+' + pts;
  if (depth > 1) { pop.style.color = '#FF9F00'; pop.style.fontSize = '1.1rem'; }

  wrap.appendChild(pop);
  setTimeout(() => pop.remove(), 800);
}

// ── HUD & state ───────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('hud-score').textContent = score.toLocaleString();
  document.getElementById('hud-moves').textContent = moves;
  const lvl = LEVELS[currentLevel];
  const pct = Math.min(100, (score / lvl.target) * 100);
  document.getElementById('prog-bar').style.width = pct + '%';

  const face = document.getElementById('cat-mood');
  if      (pct >= 100)  face.textContent = '😸';
  else if (moves <= 3)  face.textContent = '😾';
  else if (moves <= 6)  face.textContent = '😿';
  else                  face.textContent = '😺';
}

function bounceCat() {
  const el = document.getElementById('cat-mood');
  el.classList.remove('bounce');
  void el.offsetWidth;
  el.classList.add('bounce');
}

function checkEnd() {
  const lvl = LEVELS[currentLevel];
  if (score >= lvl.target) { setTimeout(showWin, 180); return; }
  if (moves <= 0)          { setTimeout(showLose, 280); return; }
  if (!hasAnyMove())       { reshuffleBoard(); }
}

function reshuffleBoard() {
  toast('No moves available — reshuffling! 🔀');
  const flat = board.flat();
  for (let i = flat.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [flat[i],flat[j]] = [flat[j],flat[i]];
  }
  let k = 0;
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      board[r][c] = flat[k++];
  if (!hasAnyMove()) reshuffleBoard();
  render();
}

// ── Win / Lose ────────────────────────────────────────────────────────────
function showWin() {
  const lvl = LEVELS[currentLevel];
  const stars = score >= lvl.stars[2] ? 3 : score >= lvl.stars[1] ? 2 : 1;
  save(currentLevel, stars);
  buildLevelGrid();

  document.getElementById('win-icon').textContent  = stars === 3 ? '🎉' : '😸';
  document.getElementById('win-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  document.getElementById('win-score').textContent = score.toLocaleString();
  document.getElementById('win-sub').textContent   = stars === 3
    ? 'Purrfect heist! Maximum mischief achieved.' : 'The cat escapes with the loot!';
  document.getElementById('next-btn').style.display =
    currentLevel < LEVELS.length - 1 ? '' : 'none';

  document.getElementById('win-ov').classList.add('active');
}

function showLose() {
  const needed = LEVELS[currentLevel].target - score;
  document.getElementById('lose-sub').textContent   = `Need ${needed.toLocaleString()} more points`;
  document.getElementById('lose-score').textContent  = score.toLocaleString();
  document.getElementById('lose-ov').classList.add('active');
}

function nextLevel() {
  if (currentLevel < LEVELS.length - 1) startLevel(currentLevel + 1);
}

function closeOverlays() {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
}

function confirmBack() {
  if (confirm('Leave level? Your progress will be lost.')) showLevelSelect();
}

// ── Toast ─────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
